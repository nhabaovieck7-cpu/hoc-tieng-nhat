<script src="config.js?v=c2a095db"></script><script src="common.js?v=e6589b31"></script><script src="auth.js?v=fb72ff4f"></script><script src="features.js?v=1a7f97e9"></script><script src="lock.js?v=28e9f29f"></script><script>LOCK.run([])</script><script type="text/plain" id="main">
const el=document.getElementById('ai'),qp=new URLSearchParams(location.search);
if(!F.AI.on()){el.innerHTML='<div class="box"><h3>Trợ lý AI chưa được bật</h3><p class="mut">Chủ trang cần cấu hình máy chủ AI (Cloudflare Worker + Gemini) rồi điền địa chỉ vào <code>config.js</code>. Trong lúc chờ, '+(HNX.ai()?HNX.ai()+' ':'')+'vẫn học bình thường các bài và trắc nghiệm.</p></div>'}else{
let mode=qp.get('che')=='chua'?'chua':'hoi',hist=F.ls.get('hn_ai_hist',[]);const mau=qp.get('mau'),bai=qp.get('bai');
el.innerHTML='<div class="tabs"><button data-m="hoi">Hỏi đáp</button><button data-m="chua">AI chữa câu</button></div>'+'<div class="qsamples" id="qsamples"><button type="button">〜ざるを得ない dùng khi nào?</button><button type="button">Phân biệt は và が</button><button type="button">〜てから và 〜たあと khác nhau sao?</button><button type="button">Dịch câu này sang tiếng Nhật</button></div>'+(mau?'<div class="box" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b class="jp">'+F.esc(mau)+'</b><div class="mut">'+F.esc(bai||'')+'</div></div><span class="pill on">Đang hỏi về mẫu này</span></div>':'')+
'<div class="chat" id="chat"></div><div class="chatin"><textarea id="q" rows="1"></textarea><button class="spk" id="go" aria-label="Gửi">➤</button></div><p class="honest" id="lim"></p>';
const chat=document.getElementById('chat'),q=document.getElementById('q'),go=document.getElementById('go');
const PH={hoi:'Nhập câu hỏi… (vd: Phân biệt 〜が早いか và 〜や否や?)',chua:'Viết một câu tiếng Nhật để AI chữa…'};
function lim(){document.getElementById('lim').textContent='Miễn phí, giới hạn '+F.AI.LIM+' câu hỏi/ngày (đã dùng '+F.AI.used()+'). AI có thể sai – kiểm tra lại với bài học.'}
function setMode(m){mode=m;el.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));q.placeholder=PH[m];const qs=document.getElementById('qsamples');if(qs)qs.style.display=m=='hoi'?'flex':'none'}
function add(cls,html){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;chat.append(d);return d}
hist.slice(-10).forEach(h=>{add('me',F.esc(h.q));add('ai',(h.m=='chua'?'<b class="mut">AI chữa câu</b><br>':'')+F.AI.fmt(h.a))});
el.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));el.querySelectorAll('#qsamples button').forEach(b=>b.onclick=()=>{q.value=b.textContent;q.focus()});setMode(mode);lim();
if(mau&&!hist.length)q.value='Giải thích mẫu '+mau+' và cho 2 ví dụ.';
async function send(){const t=q.value.trim();if(!t)return;q.value='';add('me',F.esc(t));const w=add('ai','<span class="mut">Đang trả lời…</span>');go.disabled=true;
 try{const a=await F.AI.ask(mode,t,mau?('Mẫu ngữ pháp đang học: '+mau+(bai?' (bài: '+bai+')':'')):'');w.innerHTML=(mode=='chua'?'<b class="mut">AI chữa câu</b><br>':'')+F.AI.fmt(a);hist.push({q:t,a,m:mode});F.ls.set('hn_ai_hist',hist.slice(-30));F.P.touch()}
 catch(e){w.className='msg ai err';w.textContent='⚠️ '+e.message}go.disabled=false;lim();w.scrollIntoView({block:'nearest'})}
go.onclick=send;q.addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();send()}})}
</script></body></html>
