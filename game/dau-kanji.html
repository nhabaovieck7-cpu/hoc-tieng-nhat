<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đấu trùm · Hành trình đến Edo</title>
<link rel="stylesheet" href="game.css">
<link rel="stylesheet" href="modes.css">
<link rel="stylesheet" href="bosses.css">
<link rel="stylesheet" href="gear.css"><link rel="stylesheet" href="charanim.css">
<link rel="stylesheet" href="nameplate.css">
<link rel="stylesheet" href="finisher.css">
<link rel="stylesheet" href="x-dau-kanji.css">
<link rel="stylesheet" href="plus.css">
</head>
<body class="mx-body">
<div class="mx-top"><a class="mx-back" href="index.html">← Tất cả game</a><a class="gtop-course" href="../index.html" aria-label="Quay lại khóa học">← <span>Về khóa học</span></a><span class="mx-title">⚔️ Đấu trùm</span><div id="sndToggles" class="snd-toggles"></div></div>
<main class="mx-wrap">
  <section id="menu"></section>
  <section id="play" class="mx-hid">
    <div class="bk-hud">
      <div class="bk-side"><div class="bk-name" id="pName">Người chơi</div><div class="bk-hp" id="hpBoxP"><i id="hpP"></i></div></div>
      <span class="bk-vs">VS</span>
      <div class="bk-side r"><div class="bk-name" id="bName">Trùm</div><div class="bk-hp r" id="hpBoxB"><i id="hpB"></i></div></div>
    </div>
    <div class="bk-arena" id="arena"><div class="bk-fig" id="figP">🥷</div><div class="bk-fig boss" id="figB">👹</div></div>
    <div class="mx-card">
      <div class="mx-row"><span class="mx-grow mx-mut" id="roundInfo">Hiệp 1</span><span class="mx-pill" id="scorePill">⭐ 0</span><span class="mx-pill x-trick-badge mx-hid" id="trickBadge"></span><span class="mx-pill" id="tTxt"></span></div>
      <div class="mx-timer"><i id="tBar"></i></div>
      <div class="mx-q" id="qBox"></div>
      <div class="mx-qsub" id="qSub"></div>
      <div class="mx-opts" id="optBox"></div>
      <div id="ordBox"></div>
      <div class="mx-combo" id="comboBox"></div>
      <div class="x-life" id="lifeRow">
        <button id="lfBreak" type="button">🛡️ Phá sương<small>gỡ chiêu đang áp</small></button>
        <button id="lfTime6" type="button">⏰ +6s<small>câu hiện tại</small></button>
        <button id="lf5050" type="button">🎯 50/50<small>ẩn 2 đáp án sai</small></button>
      </div>
      <div class="gplus-hud" id="dkPlusHud"></div>
      <div class="gpause-slot" id="pauseSlot"></div>
    </div>
  </section>
  <section id="result" class="mx-hid"></section>
</main>
<script src="game.js"></script>
<script src="settings.js"></script>
<script src="fx.js"></script>
<script src="questions.js"></script>
<script src="voice.js"></script>
<script src="trend.js"></script>
<script src="music.js"></script>
<script src="sfx.js"></script>
<script src="game-api.js"></script>
<script src="bosses.js"></script><script src="gear.js"></script><script src="charanim.js"></script>
<script src="nameplate.js"></script><script src="finisher.js"></script>
<script src="pause.js"></script>
<script src="plus.js"></script>
<script src="dau-kanji.js"></script>
</body>
</html>
