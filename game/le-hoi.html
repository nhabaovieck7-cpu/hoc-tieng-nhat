<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lễ hội · Hành trình đến Edo</title>
<link rel="stylesheet" href="game.css"><link rel="stylesheet" href="charanim.css">
<link rel="stylesheet" href="modes.css">
<link rel="stylesheet" href="finisher.css">
</head>
<body class="mx-body">
<div class="mx-top"><a class="mx-back" href="index.html">← Tất cả game</a><a class="gtop-course" href="../index.html" aria-label="Quay lại khóa học">← <span>Về khóa học</span></a><span class="mx-title">🏮 Lễ hội</span><div id="sndToggles" class="snd-toggles"></div></div>
<main class="mx-wrap">
  <section id="menu"></section>
  <section id="play" class="mx-hid">
    <div class="mx-card">
      <div class="fh-lanterns" aria-hidden="true"><span>🏮</span><span>🎐</span><span>🏮</span><span>🎆</span><span>🏮</span><span>🎐</span><span>🏮</span></div>
      <div class="fh-stage"><div class="fh-mascot" id="mascot">🐱</div><div id="bubbleBox"></div></div>
      <div class="mx-row"><span class="mx-grow fh-prog" id="progInfo">Câu 1/10</span><span class="mx-pill" id="scorePill">⭐ 0</span><span class="mx-pill" id="tTxt"></span></div>
      <div class="fh-chain" id="chainBox" aria-label="Chuỗi đúng"></div>
      <div class="mx-timer"><i id="tBar"></i></div>
      <div class="mx-q" id="qBox"></div>
      <div class="mx-qsub" id="qSub"></div>
      <div class="mx-opts" id="optBox"></div>
      <div id="ordBox"></div>
    </div>
  </section>
  <section id="result" class="mx-hid"></section>
</main>
<script src="game.js"></script>
<script src="settings.js"></script>
<script src="fx.js"></script>
<script src="questions.js"></script>
<script src="voice.js"></script>
<script src="trend.js"></script>
<script src="music.js"></script>
<script src="sfx.js"></script>
<script src="game-api.js"></script><script src="bosses.js"></script><script src="gear.js"></script><script src="charanim.js"></script><script src="finisher.js"></script>
<script src="le-hoi.js"></script>
</body>
</html>
