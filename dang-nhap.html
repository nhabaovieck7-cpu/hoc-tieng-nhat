<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23cf3a2e'/%3E%3Ctext x='32' y='45' font-family='serif' font-size='36' font-weight='700' fill='white' text-anchor='middle'%3E%E6%97%A5%3C/text%3E%3C/svg%3E"><script>(function(){var t='';try{t=localStorage.getItem('hn_theme')||''}catch(e){}if(t!=='dark'&&t!=='light'){try{t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){t='light'}}document.documentElement.dataset.theme=t})()</script><link rel="stylesheet" href="style.css?v=55bd96c3"><title>Đăng nhập – Học tiếng Nhật</title><meta name="description" content="Đăng nhập hoặc đăng ký tài khoản Học tiếng Nhật cùng Khánh để mở khóa nội dung bài học."><meta property="og:title" content="Đăng nhập – Học tiếng Nhật"><meta property="og:description" content="Đăng nhập hoặc đăng ký tài khoản Học tiếng Nhật cùng Khánh để mở khóa nội dung bài học."><meta property="og:type" content="website"><meta property="og:image" content="https://nhabaovieck7-cpu.github.io/hoc-tieng-nhat/icons/icon-512.png"></head><body>
<div class="topbar"><div class="wrap"><a class="brand site-title" href="index.html"></a><nav class="nav">
<a href="index.html">Trang chủ</a><a class="on" href="dang-nhap.html">Tài khoản</a></nav></div></div>
<main class="wrap">
<div class="authcard" id="card">
  <h1 id="title">Đăng nhập</h1>
  <p class="sub" id="sub">Dùng email để học. Tài khoản mới cần Khánh duyệt trước khi mở nội dung.</p>
  <div id="regFields" hidden>
    <label for="name">Tên gọi</label>
    <input id="name" autocomplete="name" placeholder="Vd: Minh">
  </div>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" placeholder="ban@email.com">
  <label for="pw">Mật khẩu</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Ít nhất 8 ký tự">
  <button class="primary" id="go" type="button">Đăng nhập</button>
  <div class="autherr" id="err"></div>
  <div id="devBox" hidden>
    <div class="autherr" id="devMsg"></div>
    <div id="devList"></div>
    <p class="switch"><a id="devCancel">Để sau — quay lại đăng nhập</a></p>
  </div>
  <p class="switch" id="switch">Chưa có tài khoản? <a id="tog">Đăng ký</a></p>
  <div class="authdiv">hoặc</div>
  <div class="oauth">
    <button type="button" data-p="google" id="btnGoogle">Google</button>
    <button type="button" data-p="facebook" disabled>Facebook <span class="soon">Sắp có</span></button>
    <button type="button" data-p="line" disabled>LINE <span class="soon">Sắp có</span></button>
    <button type="button" data-p="apple" disabled>Apple <span class="soon">Sắp có</span></button>
  </div>
  <p class="honest" style="text-align:center;margin-top:16px">Cần tài khoản đã được duyệt (hoặc đăng nhập quản lý) mới xem được bài học.<br><a href="chinh-sach.html" style="font-size:.85em">Chính sách quyền riêng tư</a></p>
</div>
</main>
<script src="config.js?v=c2a095db"></script><script src="common.js?v=abda9452"></script><script src="auth.js?v=e9bae38a"></script><script src="lock.js?v=6f8fc162"></script>
<script>
document.querySelectorAll('.site-title').forEach(e=>e.textContent=SITE.title);
let mode='login';
const title=document.getElementById('title'),sub=document.getElementById('sub'),reg=document.getElementById('regFields');
const go=document.getElementById('go'),err=document.getElementById('err'),tog=document.getElementById('tog');
const name=document.getElementById('name'),email=document.getElementById('email'),pw=document.getElementById('pw');
function setMode(m){
  mode=m;err.textContent='';
  if(m==='register'){title.textContent='Đăng ký';sub.textContent='Sau khi đăng ký, chờ Khánh duyệt rồi mới xem bài học.';reg.hidden=false;go.textContent='Đăng ký';tog.parentElement.innerHTML='Đã có tài khoản? <a id="tog">Đăng nhập</a>';document.getElementById('tog').onclick=()=>setMode('login');pw.autocomplete='new-password'}
  else{title.textContent='Đăng nhập';sub.textContent='Dùng email để học. Tài khoản mới cần Khánh duyệt trước khi mở nội dung.';reg.hidden=true;go.textContent='Đăng nhập';document.getElementById('switch').innerHTML='Chưa có tài khoản? <a id="tog">Đăng ký</a>';document.getElementById('tog').onclick=()=>setMode('register');pw.autocomplete='current-password'}
}
tog.onclick=()=>setMode('register');
// ===== Bị chặn vì tài khoản đã dùng đủ 2 thiết bị: chọn gỡ 1 thiết bị để vào =====
let devTicket='';
function fmtT(t){if(!t)return '—';try{return new Date(t).toLocaleString('vi-VN',{timeZone:'Asia/Tokyo'})}catch(e){return t}}
function hideDeviceLimit(){document.getElementById('devBox').hidden=true;devTicket=''}
function showDeviceLimit(ticket,devices,msg){
  devTicket=ticket||'';
  const box=document.getElementById('devBox');
  document.getElementById('devMsg').textContent=msg||'Tài khoản này đã đăng nhập trên 2 thiết bị khác. Hãy đăng xuất một thiết bị dưới đây để tiếp tục trên thiết bị này:';
  const dl=document.getElementById('devList');dl.innerHTML='';
  (devices||[]).forEach(d=>{
    const row=document.createElement('div');row.className='userrow';
    const meta=document.createElement('div');meta.className='meta';
    const b=document.createElement('b');b.textContent=d.label||'Thiết bị không tên';
    meta.appendChild(b);meta.appendChild(document.createElement('br'));
    meta.appendChild(document.createTextNode('Hoạt động gần nhất: '+fmtT(d.last_seen)));
    const acts=document.createElement('div');acts.className='acts';
    const btn=document.createElement('button');btn.type='button';btn.className='lock';btn.textContent='Đăng xuất thiết bị này';
    btn.onclick=async()=>{
      btn.disabled=true;
      try{
        const j=await AUTH.deviceResolve(devTicket,d.device_id);
        hideDeviceLimit();
        await afterAuth(j);
      }catch(e){
        if(e.body&&e.body.code==='device_limit'){showDeviceLimit(e.body.login_ticket,e.body.devices,e.body.error||e.message)}
        else{document.getElementById('devMsg').textContent=e.message||String(e);btn.disabled=false}
      }
    };
    acts.appendChild(btn);row.appendChild(meta);row.appendChild(acts);dl.appendChild(row);
  });
  box.hidden=false;
}
document.getElementById('devCancel').onclick=()=>hideDeviceLimit();
async function afterAuth(j){
  if(j.status==='pending'){location.href='dang-cho.html';return}
  if(j.status==='approved'){if(j.contentKey)await LOCK.importContentKey(j.contentKey);location.href='index.html';return}
  err.textContent='Trạng thái tài khoản: '+(j.status||'?');
}
go.onclick=async()=>{
  err.textContent='';go.disabled=true;
  try{
    if(mode==='register'){
      if(!name.value.trim())throw new Error('Nhập tên gọi');
      const j=await AUTH.register(name.value.trim(),email.value.trim(),pw.value);
      await afterAuth(j);
    }else{
      const j=await AUTH.login(email.value.trim(),pw.value);
      await afterAuth(j);
    }
  }catch(e){
    if(e.body&&e.body.code==='device_limit'){showDeviceLimit(e.body.login_ticket,e.body.devices,e.body.error||e.message)}
    else err.textContent=e.message||String(e)
  }
  finally{go.disabled=false}
};
document.getElementById('btnGoogle').onclick=()=>{
  err.textContent='';
  const ret=location.href.split('#')[0].split('?')[0];
  location.href=(SITE.aiEndpoint||'').replace(/\/$/,'')+'/auth/google/start?return='+encodeURIComponent(ret)
    +'&device_id='+encodeURIComponent(AUTH.deviceId())+'&device_label='+encodeURIComponent(AUTH.deviceLabel());
};
// Quay lại từ Google OAuth (?code=&status=) hoặc lỗi
(async()=>{
  const u=new URL(location.href);
  const oauthErr=u.searchParams.get('oauth_error');
  if(oauthErr){err.textContent=oauthErr;u.searchParams.delete('oauth_error');history.replaceState({},'',u.pathname+u.search+u.hash)}
  // Quay lại từ Google nhưng bị chặn vì đủ 2 thiết bị (?device_ticket=)
  const dticket=u.searchParams.get('device_ticket');
  if(dticket){
    ['device_ticket','status','oauth'].forEach(k=>u.searchParams.delete(k));
    history.replaceState({},'',u.pathname+(u.search||'')+u.hash);
    try{
      const info=await AUTH.deviceTicketInfo(dticket);
      showDeviceLimit(dticket,info.devices,'Tài khoản Google này đã đăng nhập trên 2 thiết bị khác. Hãy đăng xuất một thiết bị dưới đây để tiếp tục trên thiết bị này:');
    }catch(e){err.textContent=e.message||String(e)}
    return;
  }
  const xcode=u.searchParams.get('code');
  if(xcode){
    ['code','status','oauth'].forEach(k=>u.searchParams.delete(k));
    history.replaceState({},'',u.pathname+(u.search||'')+u.hash);
    try{
      const r=await fetch((SITE.aiEndpoint||'').replace(/\/$/,'')+'/auth/exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:xcode})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.session)throw new Error(j.error||'Đổi mã đăng nhập thất bại');
      AUTH.setSession(j.session);
      await afterAuth(j);return;
    }catch(e){err.textContent=e.message||String(e)}
  }
  // Dự phòng chuyển tiếp: Worker cũ vẫn redirect kèm ?session=
  const sess=u.searchParams.get('session');
  const st=u.searchParams.get('status');
  if(sess){
    AUTH.setSession(sess);
    ['session','status','oauth'].forEach(k=>u.searchParams.delete(k));
    history.replaceState({},'',u.pathname+(u.search||'')+u.hash);
    try{
      if(st==='pending'||st==='approved'){await afterAuth({status:st,session:sess});return}
      const j=await AUTH.me();await afterAuth(j);return;
    }catch(e){err.textContent=e.message||String(e)}
  }
  if(!AUTH.session())return;
  try{const j=await AUTH.me();await afterAuth(j)}catch(e){}
})();
</script>
</body></html>
