<script src="config.js?v=c2a095db"></script><script src="common.js?v=9230452c"></script><script src="auth.js?v=97b7b059"></script><script src="features.js?v=1a7f97e9"></script><script src="lock.js?v=28e9f29f"></script><script>LOCK.run([],{guest:()=>{}})</script><script>
(function(){
var el=document.getElementById('pt');
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var fmt=function(s){s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
var D=null,qs=[],bands=[],idx=0,ans=[],left=300,tick=null;
var BAND_LV=['N5','N4','N3','N2','N1'];
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function intro(){
 stopTick();
 el.innerHTML='<div class="box"><h3>Cách làm bài</h3><p>Bài gồm <b>25 câu</b> trắc nghiệm: 5 câu N5, 5 câu N4, 5 câu N3, 5 câu N2, 5 câu N1 — trộn từ vựng, ngữ pháp, cách đọc kanji và đọc hiểu ngắn.</p><p>Thời gian: <b>5 phút</b>. Hết giờ bài sẽ tự nộp. Câu chưa chọn được tính là sai.</p><p class="mut">Làm nghiêm túc theo sức thật của mình để phần gợi ý khóa học ở cuối được chính xác nhé.</p><button class="btn2" id="ptStart">Bắt đầu làm bài</button></div>';
 document.getElementById('ptStart').onclick=start;
}
function start(){
 idx=0;ans=qs.map(function(){return null});left=300;stopTick();
 tick=setInterval(function(){left--;var t=document.getElementById('ptTm');if(t)t.textContent='⏱ '+fmt(left);if(left<=0)submit(true)},1000);
 draw();
}
function draw(){
 var q=qs[idx],doneN=ans.filter(function(a){return a!=null}).length;
 el.innerHTML='<div class="exhead"><span class="pill">'+esc(q.level)+' · '+esc(q.section)+'</span><span class="timer" id="ptTm">⏱ '+fmt(left)+'</span></div>'
 +'<div class="bar" style="margin:8px 0"><i style="width:'+Math.round(100*(idx+1)/qs.length)+'%"></i></div>'
 +'<div class="mut">Câu '+(idx+1)+' / '+qs.length+' · Đã làm '+doneN+'</div>'
 +'<div class="exq"><div class="mqq pt-q">'+esc(q.question)+'</div>'
 +q.choices.map(function(c,j){return '<button type="button" class="opt'+(ans[idx]===j?' sel':'')+'" data-j="'+j+'"><span class="on">'+(j+1)+'</span><span class="ot">'+esc(c)+'</span></button>'}).join('')
 +'<div class="exnav"><button class="btn l" id="ptPv"'+(idx?'':' disabled')+'>← Câu trước</button><button class="btn" id="ptNx">'+(idx<qs.length-1?'Câu sau →':'Nộp bài')+'</button></div></div>'
 +'<button class="btn g" id="ptSb" style="width:100%;margin-top:8px">Nộp bài</button>';
 el.querySelectorAll('.exq .opt').forEach(function(b){b.onclick=function(){ans[idx]=+b.dataset.j;draw()}});
 document.getElementById('ptPv').onclick=function(){if(idx>0){idx--;draw();scrollTo(0,0)}};
 document.getElementById('ptNx').onclick=function(){if(idx<qs.length-1){idx++;draw();scrollTo(0,0)}else submit(false)};
 document.getElementById('ptSb').onclick=function(){submit(false)};
}
function submit(auto){
 var miss=ans.filter(function(a){return a==null}).length;
 if(!auto&&miss&&!confirm('Còn '+miss+' câu chưa làm. Nộp bài?'))return;
 stopTick();
 var score=0;qs.forEach(function(q,i){if(ans[i]===q.answer)score++});
 var bi=0;bands.forEach(function(b,i){if(score>=b.min&&score<=b.max)bi=i});
 var band=bands[bi],lv=BAND_LV[Math.min(bi,BAND_LV.length-1)];
 el.innerHTML='<div class="result"><h3 style="margin:0">Kết quả kiểm tra trình độ</h3><div class="sc">'+score+' / '+qs.length+' câu đúng</div>'
 +'<div>'+esc(band.recommend_vi)+'</div>'
 +'<div class="exnav"><a class="btn" href="index.html#'+lv.toLowerCase()+'" style="text-decoration:none">Mở khóa '+lv+' ›</a><button class="btn l" id="ptAgain">Làm lại bài</button></div></div>'
 +'<button class="btn2" id="ptReviewBtn">Xem lại từng câu + giải thích</button><div id="ptReview"></div>';
 document.getElementById('ptAgain').onclick=intro;
 document.getElementById('ptReviewBtn').onclick=function(){
  document.getElementById('ptReview').innerHTML='<div class="pt-review">'+qs.map(function(q,i){
   var a=ans[i];
   return '<div class="exq"><div class="mqq pt-q"><b>Câu '+(i+1)+' ('+esc(q.level)+' · '+esc(q.section)+'):</b> '+esc(q.question)+'</div>'
   +q.choices.map(function(c,j){return '<div class="opt'+(j===q.answer?' right':(j===a?' wrong':''))+'"><span class="on">'+(j+1)+'</span><span class="ot">'+esc(c)+'</span></div>'}).join('')
   +'<div class="mx">'+(a===q.answer?'✅ Đúng':(a==null?'⚪ Chưa làm':'❌ Sai'))+' — '+esc(q.explain_vi)+'</div></div>'}).join('')+'</div>';
  this.style.display='none';
 };
 scrollTo(0,0);
}
fetch('data/placement-test.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
 D=d;qs=d.questions||[];bands=(d.scoring||[]).slice().sort(function(a,b){return a.min-b.min});
 if(qs.length!==25||!bands.length)throw new Error('bad data');
 intro();
}).catch(function(){
 el.innerHTML='<div class="box"><h3>Chưa tải được bài kiểm tra</h3><p class="mut">Kiểm tra kết nối mạng rồi thử lại nhé.</p><button class="btn2" onclick="location.reload()">Tải lại trang</button></div>';
});
})();
</script></body></html>
