<script src="config.js?v=c2a095db"></script><script src="common.js?v=94e2c232"></script><script src="auth.js?v=fb72ff4f"></script><script src="features.js?v=1a7f97e9"></script><script src="lock.js?v=28e9f29f"></script><script src="hoc-thu.js?v=c537136f"></script><script>LOCK.run(['lessons','course_n1_np'],{guest:async()=>{
 // Khách: đề trộn N1 lấy câu từ các bài N1 học thử (Worker /free/*); đề tuần bên dưới là dữ liệu công khai.
 const L=[];for(const [s] of HT.SEC){try{const j=await LOCK.free('/free/list?level=n1&section='+s);for(const x of j.lessons.filter(x=>x.free)){try{L.push((await LOCK.free('/free/lesson?level=n1&section='+s+'&id='+encodeURIComponent(x.id))).lesson)}catch(e){}}}catch(e){}}
 window.LESSONS=L;addEventListener('guest',()=>HT.bar('Mở kho đề đầy đủ'))}})</script><script type="text/plain" id="main">
const K='hn_exam_v1',el=document.getElementById('ex');
const pool=(f)=>{const o=[];LESSONS.filter(f).forEach(l=>(l.mcq||[]).concat((l.quiz||[]).filter(x=>x.o)).forEach((x,i)=>{if(x.o&&x.o.length>=2&&x.c!=null)o.push({k:l.id+'#'+i,q:x.q,o:x.o,c:x.c,a:x.a||'',l:l.id})}));return o};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const MODES={full:{t:'Đề đầy đủ',gen:66,dk:99,min:110},quick:{t:'Đề nhanh',gen:20,dk:3,min:35}};
let E=F.ls.get(K,null),tick=0;const save=()=>F.ls.set(K,E);
function start(m){const M=MODES[m];const gen=shuf(pool(l=>l.level=='N1'&&l.type!='Đọc hiểu')).slice(0,M.gen).map(x=>Object.assign(x,{p:0}));const dk=shuf(pool(l=>l.level=='N1'&&l.type=='Đọc hiểu')).slice(0,M.dk).map(x=>Object.assign(x,{p:1}));
 E={m,qs:gen.concat(dk).map(x=>({k:x.k,p:x.p})),ans:{},i:0,start:Date.now(),end:Date.now()+M.min*6e4,min:M.min,done:false};save();run()}
const byK=()=>{const m={};pool(l=>l.level=='N1').forEach(x=>m[x.k]=x);return m};let Q={};
const PART=['言語知識（文字・語彙・文法）','読解'];
function menu(){const n0=pool(l=>l.level=='N1'&&l.type!='Đọc hiểu').length,n1=pool(l=>l.level=='N1'&&l.type=='Đọc hiểu').length;
 el.innerHTML='<div class="box"><h3>Chọn đề</h3><p class="mut">Kho hiện có '+n0+' câu 言語知識 và '+n1+' câu 読解. Mỗi lần làm là một đề trộn mới.</p>'+Object.entries(MODES).map(([k,M])=>'<button class="btn2" data-m="'+k+'">'+M.t+' · '+Math.min(M.gen,n0)+' + '+Math.min(M.dk,n1)+' câu · '+M.min+' phút</button>').join('')+'<p class="honest">Chưa có phần 聴解 (nghe) trong đề – điểm chỉ tính 2 phần, quy về thang 60 mỗi phần. Luyện nghe riêng ở mục 🎧 Luyện nghe.</p></div>'+hist();
 el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>start(b.dataset.m))}
function hist(){const h=F.ls.get('hn_exam_hist',[]);return h.length?'<div class="box" style="margin-top:12px"><h3>Lần thi trước</h3>'+h.slice(-5).reverse().map(r=>'<div>'+r.d+' · '+r.t+' · <b>'+r.s+'/120</b> '+(r.pass?'✅':'❌')+'</div>').join('')+'</div>':''}
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function run(){Q=byK();E.qs=E.qs.filter(x=>Q[x.k]);if(!E.qs.length){F.ls.set(K,null);E=null;return menu()}if(E.done)return result();clearInterval(tick);tick=setInterval(()=>{const t=document.getElementById('tm');if(!t)return;const left=E.end-Date.now();t.textContent='⏱ '+fmt(left);if(left<=0){clearInterval(tick);submit(true)}},1000);draw()}
function draw(){const x=E.qs[E.i],q=Q[x.k],a=E.ans[x.k],nA=Object.keys(E.ans).length;
 el.innerHTML='<div class="exhead"><span class="pill">Phần '+(x.p+1)+' · '+PART[x.p]+'</span><span class="timer" id="tm">⏱ '+fmt(E.end-Date.now())+'</span></div><div class="bar" style="margin:8px 0"><i style="width:'+Math.round(100*(E.i+1)/E.qs.length)+'%"></i></div><div class="mut">Câu '+(E.i+1)+' / '+E.qs.length+' · Đã làm '+nA+'</div>'+
 '<div class="exq"><div class="mqq">'+ruby(typeof prepMcqQ=='function'?prepMcqQ(q.q,q.o):q.q).replace(/^Câu \d+\.\s*/,'')+'</div>'+q.o.map((o,j)=>'<button type="button" class="opt'+(a===j?' sel':'')+'" data-j="'+j+'"><span class="on">'+(j+1)+'</span><span class="ot">'+ruby(o)+'</span></button>').join('')+
 '<div class="exnav"><button class="btn l" id="pv"'+(E.i?'':' disabled')+'>← Câu trước</button><button class="btn" id="nx">'+(E.i<E.qs.length-1?'Câu sau →':'Nộp bài')+'</button></div></div>'+
 '<details><summary class="mut">Bảng câu hỏi</summary><div class="exgrid">'+E.qs.map((y,i)=>'<button class="'+(E.ans[y.k]!=null?'a':'')+(i==E.i?' cur':'')+'" data-i="'+i+'">'+(i+1)+'</button>').join('')+'</div></details><button class="btn g" id="sb" style="width:100%;margin-top:8px">Nộp bài</button>';
 el.querySelectorAll('.exq .opt').forEach(b=>b.onclick=()=>{E.ans[x.k]=+b.dataset.j;save();draw()});
 document.getElementById('pv').onclick=()=>{E.i--;save();draw()};document.getElementById('nx').onclick=()=>{if(E.i<E.qs.length-1){E.i++;save();draw();scrollTo(0,0)}else submit()};
 el.querySelectorAll('.exgrid button').forEach(b=>b.onclick=()=>{E.i=+b.dataset.i;save();draw()});document.getElementById('sb').onclick=()=>submit()}
function submit(auto){if(!auto){const left=E.qs.length-Object.keys(E.ans).length;if(!confirm(left?'Còn '+left+' câu chưa làm. Nộp bài?':'Nộp bài?'))return}clearInterval(tick);E.done=true;E.used=Math.min(E.min,Math.round((Date.now()-E.start)/6e4));
 const sc=[0,1].map(p=>{const qs=E.qs.filter(x=>x.p==p);const ok=qs.filter(x=>E.ans[x.k]===Q[x.k].c).length;return {ok,n:qs.length,s:qs.length?Math.round(60*ok/qs.length):0}});
 E.sc=sc;save();const tot=sc[0].s+sc[1].s,pass=tot>=67&&sc.every(x=>x.n==0||x.s>=19);const h=F.ls.get('hn_exam_hist',[]);h.push({d:new Date().toLocaleDateString('vi-VN'),t:MODES[E.m].t,s:tot,pass});F.ls.set('hn_exam_hist',h.slice(-20));
 F.P.score('thi-thu-n1','Thi thử N1 ('+MODES[E.m].t+')',sc[0].ok+sc[1].ok,sc[0].n+sc[1].n);result()}
function result(){const sc=E.sc,tot=sc[0].s+sc[1].s,pass=tot>=67&&sc.every(x=>x.n==0||x.s>=19);
 el.innerHTML='<div class="result'+(pass?'':' fail')+'"><h3 style="margin:0">Kết quả</h3><div class="sc">'+tot+' / 120 · '+(pass?'ĐẠT ✓':'CHƯA ĐẠT')+'</div><div>言語知識: '+sc[0].s+'/60 ('+sc[0].ok+'/'+sc[0].n+' câu) · 読解: '+sc[1].s+'/60 ('+sc[1].ok+'/'+sc[1].n+' câu) · 聴解: chưa có</div><div class="mut">Thời gian: '+E.used+' phút / '+E.min+' phút. Ước tính: mỗi phần ≥19/60 và tổng ≥ 67/120 (tương đương mốc đỗ 100/180).</div><div class="exnav"><button class="btn l" id="rv">Xem lại bài</button><button class="btn" id="nw">Làm đề mới</button></div></div><div id="rvl"></div>';
 document.getElementById('nw').onclick=()=>{F.ls.set(K,null);E=null;menu()};
 document.getElementById('rv').onclick=()=>{document.getElementById('rvl').innerHTML=E.qs.map((x,i)=>{const q=Q[x.k],a=E.ans[x.k];return '<div class="exq"><div class="mqq"><b>Câu '+(i+1)+':</b> '+ruby(typeof prepMcqQ=='function'?prepMcqQ(q.q,q.o):q.q).replace(/^Câu \d+\.\s*/,'')+'</div>'+q.o.map((o,j)=>'<div class="opt'+(j==q.c?' right':(j===a?' wrong':''))+'"><span class="on">'+(j+1)+'</span><span class="ot">'+ruby(o)+'</span></div>').join('')+'<div class="mx">'+(a===q.c?'✅ Đúng':(a==null?'⚪ Chưa làm':'❌ Sai'))+' – '+ruby(q.a)+' <a href="lesson.html?id='+q.l+'">Bài học ›</a></div></div>'}).join('')}}
E?run():menu();
</script><script>
(function(){
var box=document.getElementById('wm');if(!box)return;
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var KEY='hn_weekly_mock_v1';
var man=null,week=null,cur=null,data=null,ans=[];
function saved(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
function saveRes(w,lv,score,total){var o=saved();o[w+'-'+lv]={score:score,total:total,at:Date.now()};try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function menu(){
 var weeks=man.weeks.slice().sort(function(a,b){return b.week-a.week});
 if(!week)week=weeks[0];
 var sv=saved();
 var sel=weeks.length>1?'<p><label>Tuần: <select id="wmWeek">'+weeks.map(function(w){return '<option value="'+w.week+'"'+(w.week===week.week?' selected':'')+'>'+esc(w.label||('Tuần '+w.week))+'</option>'}).join('')+'</select></label></p>':'';
 box.innerHTML='<div class="box" style="margin-top:12px"><h3>📅 Đề thi thử hằng tuần</h3><p class="mut">Mỗi tuần một đề 20 câu theo đúng dạng JLPT: 文字・語彙 · 文法 · 読解. Chọn cấp để bắt đầu — nộp bài là xem được điểm và giải thích từng câu.</p>'+sel+'<div>'+week.levels.map(function(L){var r=sv[week.week+'-'+L.level];return '<button type="button" class="pill" data-lv="'+esc(L.level)+'" style="margin:2px">Thi thử '+esc(L.level)+' · '+L.questions+' câu'+(r?' · lần gần nhất '+r.score+'/'+r.total:'')+'</button>'}).join('')+'</div></div>';
 var wsel=document.getElementById('wmWeek');
 if(wsel)wsel.onchange=function(){week=man.weeks.find(function(w){return w.week===+wsel.value});menu()};
 box.querySelectorAll('[data-lv]').forEach(function(b){b.onclick=function(){load(week,b.dataset.lv)}});
}
function load(w,lv){
 cur=w.levels.find(function(L){return L.level===lv});
 box.innerHTML='<div class="box" style="margin-top:12px">Đang tải đề '+esc(lv)+'…</div>';
 fetch('data/weekly-mock/'+cur.file).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
  data=d;ans=d.questions.map(function(){return null});paper();
 }).catch(function(){box.innerHTML='<div class="box" style="margin-top:12px"><h3>Chưa tải được đề</h3><p class="mut">Kiểm tra kết nối mạng rồi thử lại nhé.</p><button class="btn2" id="wmBack">← Quay lại chọn cấp</button></div>';document.getElementById('wmBack').onclick=menu});
}
function paper(){
 var qs=data.questions;
 box.innerHTML='<div class="box" style="margin-top:12px"><h3>📅 Đề thi thử '+esc(week.label||('Tuần '+week.week))+' · '+esc(data.level)+'</h3><p class="mut">'+qs.length+' câu · 文字・語彙 '+qs.filter(function(q){return q.section==='文字・語彙'}).length+' · 文法 '+qs.filter(function(q){return q.section==='文法'}).length+' · 読解 '+qs.filter(function(q){return q.section==='読解'}).length+'</p></div>'
 +qs.map(function(q,i){return '<div class="exq"><div class="mqq"><b>Câu '+(i+1)+' ('+esc(q.section)+'):</b> '+esc(q.question)+'</div>'+q.choices.map(function(c,j){return '<button type="button" class="opt'+(ans[i]===j?' sel':'')+'" data-i="'+i+'" data-j="'+j+'"><span class="on">'+(j+1)+'</span><span class="ot">'+esc(c)+'</span></button>'}).join('')+'</div>'}).join('')
 +'<button class="btn" id="wmSubmit" style="width:100%">Nộp bài</button><button class="btn2" id="wmQuit">← Chọn cấp khác</button>';
 box.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){var i=+b.dataset.i;ans[i]=+b.dataset.j;b.parentElement.querySelectorAll('.opt').forEach(function(x){x.classList.toggle('sel',+x.dataset.j===ans[i])})}});
 document.getElementById('wmQuit').onclick=menu;
 document.getElementById('wmSubmit').onclick=function(){
  var miss=ans.filter(function(a){return a==null}).length;
  if(miss&&!confirm('Còn '+miss+' câu chưa làm. Nộp bài?'))return;
  grade();
 };
}
function grade(){
 var qs=data.questions,score=0;
 qs.forEach(function(q,i){if(ans[i]===q.answer)score++});
 saveRes(week.week,data.level,score,qs.length);
 if(window.__pracResultHTML){box.innerHTML=window.__pracResultHTML({title:'Kết quả đề thi thử '+(week.label||('Tuần '+week.week))+' · '+data.level,questions:qs,answers:ans,buttons:'<div class="exnav"><button class="btn" id="wmRetry">Làm lại đề này</button><button class="btn l" id="wmMenu">Chọn cấp khác</button></div>'})}
 else{ box.innerHTML='<div class="result" style="margin-top:12px"><h3 style="margin:0">Kết quả đề thi thử '+esc(week.label||('Tuần '+week.week))+' · '+esc(data.level)+'</h3><div class="sc">'+score+' / '+qs.length+'</div><div class="mut">Đáp án và giải thích từng câu ở ngay bên dưới.</div><div class="exnav"><button class="btn" id="wmRetry">Làm lại đề này</button><button class="btn l" id="wmMenu">Chọn cấp khác</button></div></div>'
 +qs.map(function(q,i){var a=ans[i];return '<div class="exq"><div class="mqq"><b>Câu '+(i+1)+' ('+esc(q.section)+'):</b> '+esc(q.question)+'</div>'+q.choices.map(function(c,j){return '<div class="opt wm-static'+(j===q.answer?' right':(j===a?' wrong':''))+'"><span class="on">'+(j+1)+'</span><span class="ot">'+esc(c)+'</span></div>'}).join('')+'<div class="mx">'+(a===q.answer?'✅ Đúng':(a==null?'⚪ Chưa làm':'❌ Sai — đáp án đúng là: '+esc(q.choices[q.answer])))+'<br>'+esc(q.explain_vi)+'</div></div>'}).join('');}
 document.getElementById('wmRetry').onclick=function(){ans=data.questions.map(function(){return null});paper();scrollTo(0,box.offsetTop)};
 document.getElementById('wmMenu').onclick=menu;
 scrollTo(0,box.offsetTop);
}
fetch('data/weekly-mock/index.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(m){man=m;menu()}).catch(function(){box.innerHTML='<div class="box" style="margin-top:12px"><h3>📅 Đề thi thử hằng tuần</h3><p class="mut">Chưa tải được danh sách đề — kiểm tra kết nối mạng rồi tải lại trang nhé.</p></div>'});
})();
</script><script>
(function(){

function $(id){return document.getElementById(id)}
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var SECTIONS=['文字・語彙','文法','読解'];
var LVORD={'N5':0,'N4':1,'N3':2,'N2':3,'N1':4};
var KEY='hn_practice_v1';
function store(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
function saveResult(kind,id,res){var o=store();o[kind]=o[kind]||{};o[kind][id]=res;try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function lastResult(kind,id){var o=store();return (o[kind]||{})[id]||null}
function pad(n){return String(n).padStart(2,'0')}
function fmtClock(sec){sec=Math.max(0,Math.ceil(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h>0?h+':'+pad(m)+':'+pad(s):m+':'+pad(s)}
function jstToday(){try{var parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());var m={};parts.forEach(function(p){m[p.type]=p.value});return m.year+'-'+m.month+'-'+m.day}catch(e){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}}
function dmy(iso){var p=String(iso||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(iso||'')}
function secStats(qs,ans){var st={};SECTIONS.forEach(function(s){st[s]={ok:0,n:0}});qs.forEach(function(q,i){if(!st[q.section])st[q.section]={ok:0,n:0};st[q.section].n++;if(ans[i]===q.answer)st[q.section].ok++});return SECTIONS.filter(function(s){return st[s]&&st[s].n>0}).map(function(s){return{name:s,ok:st[s].ok,n:st[s].n,pct:Math.round(100*st[s].ok/st[s].n)}})}
var ADVICE={'文字・語彙':'Hãy dành 10–15 phút mỗi ngày ôn từ vựng và cách đọc kanji của cấp này (dùng mục Ôn tập thẻ trên trang), chú ý ôn lại chính những từ vừa sai trong phần giải đề bên dưới.','文法':'Hãy học lại các mẫu ngữ pháp của cấp này trong khóa học — nhất là các mẫu xuất hiện ở câu sai — rồi quay lại làm lại những câu đó sau 1–2 ngày.','読解':'Hãy luyện đọc đoạn văn ngắn mỗi ngày: đọc câu hỏi trước, gạch chân từ khóa trong bài và chú ý các từ nối như しかし、だから、たとえば để nắm ý chính nhanh hơn.'};
function commentFor(pct,stats){
 var band;
 if(pct>=90)band='Xuất sắc! '+(HNX.ai()?HNX.cap(HNX.ai())+' nắm':'Nắm')+' rất chắc kiến thức ở cấp này — cứ giữ nhịp ôn tập này là sẵn sàng cho kỳ thi thật.';
 else if(pct>=75)band='Rất tốt! Nền tảng'+(HNX.cua()?' '+HNX.cua():'')+' khá vững, chỉ còn vài chỗ hổng nhỏ — xem kỹ phần giải đề bên dưới để lấp nốt nhé.';
 else if(pct>=60)band='Khá! '+(HNX.ai()?HNX.cap(HNX.ai())+' đã':'Đã')+' chạm mốc đạt, nhưng chưa thật sự chắc — ôn thêm phần yếu rồi làm lại đề để điểm ổn định hơn nhé.';
 else if(pct>=40)band=(HNX.ai()?HNX.cap(HNX.ai())+' đã':'Đã')+' có nền cơ bản nhưng còn nhiều chỗ hổng. Đừng nản — học theo từng phần như gợi ý bên dưới rồi làm lại đề sau ít ngày.';
 else band='Kết quả còn thấp, nhưng làm đề là cách nhanh nhất để thấy mình đang hổng ở đâu. Hãy quay lại học theo khóa của cấp này, nắm chắc phần cơ bản rồi trở lại làm đề nhé.';
 if(stats.length>1){
  var sorted=stats.slice().sort(function(a,b){return a.pct-b.pct});
  var weak=sorted[0],strong=sorted[sorted.length-1];
  if(weak.pct<strong.pct){
   band+=' Phần yếu nhất là '+weak.name+' ('+weak.pct+'%). '+ADVICE[weak.name];
   band+=' Phần mạnh nhất là '+strong.name+' ('+strong.pct+'%) — phát huy thế mạnh này nhé!';
  }else{
   band+=' Các phần đang khá đồng đều ('+weak.pct+'%) — hãy nâng dần độ khó và giữ nhịp luyện tập hằng ngày nhé.';
  }
 }
 return band;
}
/* Màn hình kết quả dùng chung: daily / full / weekly */
window.__pracResultHTML=function(o){
 var qs=o.questions,ans=o.answers,stats=secStats(qs,ans),ok=0;
 qs.forEach(function(q,i){if(ans[i]===q.answer)ok++});
 var pct=qs.length?Math.round(100*ok/qs.length):0;
 var verdictHtml='',failCls='';
 if(o.pass){
  var passAll=pct>=o.pass.total_pct&&stats.every(function(s){return s.pct>=o.pass.section_min_pct});
  failCls=passAll?'':' fail';
  verdictHtml='<div class="sc">'+ok+' / '+qs.length+' · '+pct+'% · '+(passAll?'ĐẠT ✓':'CHƯA ĐẠT')+'</div><div class="mut">Điều kiện đạt: tổng ≥ '+o.pass.total_pct+'% và mỗi phần ≥ '+o.pass.section_min_pct+'%.</div>';
 }else{
  verdictHtml='<div class="sc">'+ok+' / '+qs.length+' · '+pct+'%</div>';
 }
 var secLine=stats.map(function(s){return esc(s.name)+': '+s.ok+'/'+s.n+' ('+s.pct+'%)'+(o.pass&&s.pct<o.pass.section_min_pct?' ⚠ dưới mốc phần':'')}).join(' · ');
 var html='<div class="result'+failCls+'" style="margin-top:12px"><h3 style="margin:0">'+esc(o.title)+'</h3>'+verdictHtml
  +'<div style="margin-top:6px">'+secLine+'</div>'
  +'<div style="margin-top:8px"><b>Nhận xét:</b> '+esc(commentFor(pct,stats))+'</div>'
  +(o.buttons||'')+'</div>'
  +'<h3 style="margin:16px 0 4px">Giải đề chi tiết</h3>'
  +qs.map(function(q,i){var a=ans[i];return '<div class="exq"><div class="mqq"><b>Câu '+(i+1)+' ('+esc(q.section)+'):</b> '+esc(q.question)+'</div>'+q.choices.map(function(c,j){return '<div class="opt pr-static'+(j===q.answer?' right':(j===a?' wrong':''))+'"><span class="on">'+(j+1)+'</span><span class="ot">'+esc(c)+'</span></div>'}).join('')+'<div class="mx">'+(a===q.answer?'✅ Đúng':(a==null?'⚪ Chưa làm':'❌ Sai — đáp án đúng là: '+esc(q.choices[q.answer])))+'<br>'+esc(q.explain_vi)+'</div></div>'}).join('');
 return html;
};
function computeResult(qs,ans,pass){
 var stats=secStats(qs,ans),ok=0;qs.forEach(function(q,i){if(ans[i]===q.answer)ok++});
 var pct=qs.length?Math.round(100*ok/qs.length):0;
 var res={score:ok,total:qs.length,pct:pct,sections:{},at:Date.now()};
 stats.forEach(function(s){res.sections[s.name]=s.pct});
 if(pass)res.pass=(pct>=pass.total_pct&&stats.every(function(s){return s.pct>=pass.section_min_pct}))?1:0;
 return res;
}
/* Bộ máy làm bài dùng chung cho đề ngắn + đề chính thức */
function startExam(box,cfg){
 box.innerHTML='<div class="box" style="margin-top:12px">Đang tải đề '+esc(cfg.level)+' ('+dmy(cfg.date)+')…</div>';
 fetch(cfg.base+cfg.file).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(data){
  var qs=data.questions||[];
  if(!qs.length)throw new Error('empty');
  var ans=qs.map(function(){return null});
  var dur=+data.duration_minutes||+cfg.duration||0;
  var end=dur?Date.now()+dur*60000:0,tick=null,finished=false;
  var pass=(cfg.kind==='full'&&(data.pass||cfg.pass))||null;
  function stopTick(){if(tick){clearInterval(tick);tick=null}}
  function alive(){return !!box.querySelector('[data-paper]')}
  function drawPaper(){
   box.innerHTML='<div class="box" style="margin-top:12px" data-paper><h3>'+esc(cfg.icon+' '+cfg.title)+'</h3>'
   +'<div class="exhead"><span class="pill">'+esc(data.level||cfg.level)+' · '+qs.length+' câu</span>'+(dur?'<span class="timer" data-tm>⏱ '+fmtClock((end-Date.now())/1000)+'</span>':'')+'</div>'
   +'<div class="mut">Đã làm <span data-done>0</span>/'+qs.length+' câu'+(dur?' · Thời gian làm bài: '+dur+' phút, hết giờ hệ thống tự nộp bài.':'')+'</div></div>'
   +qs.map(function(q,i){return '<div class="exq"><div class="mqq"><b>Câu '+(i+1)+' ('+esc(q.section)+'):</b> '+esc(q.question)+'</div>'+q.choices.map(function(c,j){return '<button type="button" class="opt'+(ans[i]===j?' sel':'')+'" data-i="'+i+'" data-j="'+j+'"><span class="on">'+(j+1)+'</span><span class="ot">'+esc(c)+'</span></button>'}).join('')+'</div>'}).join('')
   +(dur?'<p class="mut" style="margin:10px 0 4px">Thời gian còn lại: <span class="timer" data-tm>⏱ '+fmtClock((end-Date.now())/1000)+'</span></p>':'')
   +'<button class="btn" data-submit style="width:100%">Nộp bài</button><button class="btn2" data-quit>← Danh sách đề</button>';
   box.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){var i=+b.dataset.i;ans[i]=+b.dataset.j;b.parentElement.querySelectorAll('.opt').forEach(function(x){x.classList.toggle('sel',+x.dataset.j===ans[i])});var dn=box.querySelector('[data-done]');if(dn)dn.textContent=ans.filter(function(a){return a!=null}).length}});
   box.querySelector('[data-quit]').onclick=function(){stopTick();cfg.onMenu()};
   box.querySelector('[data-submit]').onclick=function(){
    var miss=ans.filter(function(a){return a==null}).length;
    if(miss&&!confirm('Còn '+miss+' câu chưa làm. Nộp bài?'))return;
    finish();
   };
   scrollTo(0,box.offsetTop);
   if(dur){stopTick();tick=setInterval(function(){
     if(!alive()){stopTick();return}
     var left=end-Date.now();
     box.querySelectorAll('[data-tm]').forEach(function(t){t.textContent='⏱ '+fmtClock(left/1000)});
     if(left<=0){stopTick();finish()}
   },500)}
  }
  function finish(){
   if(finished)return;finished=true;stopTick();
   var res=computeResult(qs,ans,pass);
   saveResult(cfg.kind,cfg.date+'-'+(data.level||cfg.level),res);
   box.innerHTML=window.__pracResultHTML({title:'Kết quả '+cfg.title+' · '+(data.level||cfg.level)+' · '+dmy(cfg.date),questions:qs,answers:ans,pass:pass,buttons:'<div class="exnav"><button class="btn" data-retry>Làm lại đề này</button><button class="btn l" data-menu>Danh sách đề</button></div>'});
   box.querySelector('[data-retry]').onclick=function(){startExam(box,cfg)};
   box.querySelector('[data-menu]').onclick=function(){cfg.onMenu()};
   scrollTo(0,box.offsetTop);
  }
  drawPaper();
 }).catch(function(){
  box.innerHTML='<div class="box" style="margin-top:12px"><h3>Chưa tải được đề</h3><p class="mut">Kiểm tra kết nối mạng rồi thử lại nhé.</p><button class="btn2" data-back>← Danh sách đề</button></div>';
  box.querySelector('[data-back]').onclick=function(){cfg.onMenu()};
 });
}
window.__pracStartExam=startExam;
/* ---------- Khối đề luyện tập hôm nay ---------- */
var pdBox=$('pd'),dailyTests=null;
function dailyMenu(){
 if(!pdBox)return;
 function render(){
  var today=jstToday();
  var tests=dailyTests.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:((LVORD[a.level]||9)-(LVORD[b.level]||9))});
  var t0=tests.filter(function(t){return t.date===today});
  var past=tests.filter(function(t){return t.date<today});
  var upcoming=tests.filter(function(t){return t.date>today});
  function btn(t,label){var r=lastResult('daily',t.date+'-'+t.level);return '<button type="button" class="pill" data-date="'+esc(t.date)+'" data-lv="'+esc(t.level)+'" data-file="'+esc(t.file)+'" style="margin:2px">'+label+' · '+esc(t.level)+(t.questions?' · '+t.questions+' câu':'')+(r?' · lần gần nhất '+r.score+'/'+r.total:'')+'</button>'}
  var h='<div class="box" style="margin-top:12px"><h3>☀️ Đề luyện tập hôm nay</h3>';
  if(t0.length){
   h+='<p class="mut">Đề ngắn mới mỗi ngày, xoay vòng cấp độ N5→N1, đăng trước 5 giờ sáng. Có bấm giờ, chấm điểm từng phần, nhận xét và giải thích chi tiết.</p><div>'+t0.map(function(t){return btn(t,'▶ Đề hôm nay '+dmy(t.date))}).join('')+'</div>';
  }else{
   h+='<p class="mut">Hôm nay ('+dmy(today)+') chưa có đề mới. Đề mới đăng trước 5 giờ sáng — trong lúc chờ, làm lại đề các ngày trước nhé.</p>';
  }
  if(past.length)h+='<p style="margin-top:10px"><b>Đề các ngày trước</b></p><div>'+past.map(function(t){return btn(t,dmy(t.date))}).join('')+'</div>';
  if(upcoming.length)h+='<p style="margin-top:10px"><b>Đề sắp tới</b></p><div>'+upcoming.map(function(t){return btn(t,dmy(t.date))}).join('')+'</div>';
  h+='</div>';
  pdBox.innerHTML=h;
  pdBox.querySelectorAll('[data-file]').forEach(function(b){b.onclick=function(){startExam(pdBox,{kind:'daily',base:'data/practice/daily/',file:b.dataset.file,date:b.dataset.date,level:b.dataset.lv,icon:'☀️',title:'Đề luyện tập',onMenu:dailyMenu})}});
 }
 if(dailyTests){render();return}
 fetch('data/practice/daily/index.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(m){dailyTests=(m&&m.tests)||[];render()}).catch(function(){pdBox.innerHTML='<div class="box" style="margin-top:12px"><h3>☀️ Đề luyện tập hôm nay</h3><p class="mut">Chưa tải được danh sách đề — kiểm tra kết nối mạng rồi tải lại trang nhé.</p></div>'});
}
/* ---------- Khối đề chính thức thứ 7 ---------- */
var pfBox=$('pf'),fullExams=null;
function fullMenu(){
 if(!pfBox)return;
 function render(){
  var exams=fullExams.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:((LVORD[a.level]||9)-(LVORD[b.level]||9))});
  var dates=[];exams.forEach(function(e){if(dates.indexOf(e.date)<0)dates.push(e.date)});
  function btn(e){var r=lastResult('full',e.date+'-'+e.level);return '<button type="button" class="pill" data-date="'+esc(e.date)+'" data-lv="'+esc(e.level)+'" data-file="'+esc(e.file)+'" data-dur="'+(+e.duration_minutes||0)+'" style="margin:2px">'+esc(e.level)+(e.questions?' · '+e.questions+' câu':'')+(e.duration_minutes?' · '+e.duration_minutes+' phút':'')+(r?' · lần gần nhất '+r.score+'/'+r.total+(r.pass!=null?(r.pass?' · ĐẠT ✓':' · chưa đạt'):''):'')+'</button>'}
  var h='<div class="box" style="margin-top:12px"><h3>🏆 Đề chính thức thứ 7</h3><p class="mut">Mỗi thứ 7 một đợt đề đầy đủ cho cả 5 cấp, dài như đề JLPT thật: bấm giờ, chấm điểm từng phần, kết luận ĐẠT / CHƯA ĐẠT (tổng ≥ 60% và mỗi phần ≥ 40%), kèm nhận xét và giải đề chi tiết.</p>';
  if(dates.length){
   var latest=dates[0];
   h+='<p><b>Đợt mới nhất — thứ 7, '+dmy(latest)+'</b></p><div>'+exams.filter(function(e){return e.date===latest}).map(btn).join('')+'</div>';
   dates.slice(1).forEach(function(dt){h+='<p style="margin-top:10px"><b>Đợt '+dmy(dt)+'</b></p><div>'+exams.filter(function(e){return e.date===dt}).map(btn).join('')+'</div>'});
  }else{
   h+='<p class="mut">Chưa có đợt đề chính thức nào — đợt đầu tiên sẽ đăng vào thứ 7 hằng tuần.</p>';
  }
  h+='</div>';
  pfBox.innerHTML=h;
  pfBox.querySelectorAll('[data-file]').forEach(function(b){b.onclick=function(){startExam(pfBox,{kind:'full',base:'data/practice/full/',file:b.dataset.file,date:b.dataset.date,level:b.dataset.lv,duration:+b.dataset.dur||0,icon:'🏆',title:'Đề chính thức thứ 7',onMenu:fullMenu})}});
 }
 if(fullExams){render();return}
 fetch('data/practice/full/index.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(m){fullExams=(m&&m.exams)||[];render()}).catch(function(){pfBox.innerHTML='<div class="box" style="margin-top:12px"><h3>🏆 Đề chính thức thứ 7</h3><p class="mut">Chưa tải được danh sách đề — kiểm tra kết nối mạng rồi tải lại trang nhé.</p></div>'});
}
dailyMenu();
fullMenu();
})();
</script>

<script>
(function(){
"use strict";
function $(id){return document.getElementById(id)}
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var box=$('pt');if(!box)return;
var KIND={'n1-set':{label:'Bộ câu hỏi N1',icon:'🧩'},'reading':{label:'Đọc hiểu',icon:'📖'},'sat-set':{label:'Bộ dài thứ Bảy',icon:'🗓'},'kaiwa':{label:'Kaiwa',icon:'💬'}};
var items=null;
function dmy(iso){var p=String(iso||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(iso||'')}
function lastTutor(id){try{var o=JSON.parse(localStorage.getItem('hn_practice_v1')||'{}');return (o.tutor||{})[id]||null}catch(e){return null}}
function emptyState(){
 box.innerHTML='<div class="box" style="margin-top:12px"><h3>📚 Ôn N1 cùng gia sư</h3><p class="mut">Chưa có bài nào. Các bài ôn N1 (bộ câu hỏi, đọc hiểu, kaiwa) sẽ được đăng dần theo lịch gia sư — quay lại sau nhé.</p></div>';
}
function menu(){
 if(!items||!items.length){emptyState();return}
 var sorted=items.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
 var h='<div class="box" style="margin-top:12px"><h3>📚 Ôn N1 cùng gia sư</h3><p class="mut">Bài ôn N1 đăng theo lịch gia sư: bộ câu hỏi và bài đọc làm như đề thi (có điểm và giải thích từng câu), bài kaiwa đọc hội thoại kèm bản dịch ngay dưới mỗi câu.</p>';
 sorted.forEach(function(it,idx){
  var k=KIND[it.kind]||{label:it.kind,icon:'📄'};
  var r=it.kind!=='kaiwa'?lastTutor(it.date+'-N1'):null;
  h+='<div style="margin:6px 0"><button type="button" class="pill" data-idx="'+idx+'" style="margin:2px">'+k.icon+' '+esc(it.title||k.label)+' · '+dmy(it.date)+(r?' · lần gần nhất '+r.score+'/'+r.total:'')+'</button></div>';
 });
 h+='</div>';
 box.innerHTML=h;
 box.querySelectorAll('[data-idx]').forEach(function(b){b.onclick=function(){openItem(sorted[+b.dataset.idx])}});
}
function openItem(it){
 if(it.kind==='kaiwa'){openKaiwa(it);return}
 if(!window.__pracStartExam){
  box.innerHTML='<div class="box" style="margin-top:12px"><h3>📚 Ôn N1 cùng gia sư</h3><p class="mut">Chưa sẵn sàng — tải lại trang rồi thử nhé.</p><button class="btn2" data-b>← Danh sách bài</button></div>';
  box.querySelector('[data-b]').onclick=menu;return;
 }
 var k=KIND[it.kind]||{label:it.kind,icon:'📄'};
 window.__pracStartExam(box,{kind:'tutor',base:'data/tutor-n1/',file:it.file,date:it.date,level:'N1',icon:k.icon,title:(it.title||k.label),onMenu:menu});
}
function openKaiwa(it){
 box.innerHTML='<div class="box" style="margin-top:12px">Đang tải bài kaiwa…</div>';
 fetch('data/tutor-n1/'+it.file).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
  var h='<div class="box" style="margin-top:12px"><h3>💬 '+(d.lesson!=null?'Kaiwa bài '+esc(d.lesson)+' · ':'Kaiwa · ')+esc(d.topic||it.title||'')+'</h3>';
  (d.lines||[]).forEach(function(L){
   h+='<div style="margin:10px 0"><b>'+esc(L.speaker||'')+'</b><div>'+esc(L.ja||'')+'</div><div class="mut">'+esc(L.vi||'')+'</div></div>';
  });
