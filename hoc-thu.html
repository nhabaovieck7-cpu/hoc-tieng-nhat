<script src="config.js?v=c2a095db"></script><script src="common.js?v=94e2c232"></script><script src="auth.js?v=fb72ff4f"></script><script src="features.js?v=1a7f97e9"></script><script src="lock.js?v=28e9f29f"></script><script src="hoc-thu.js?v=c537136f"></script><script>
(async function(){
document.documentElement.classList.remove('locked');
const SEC=HT.SEC,esc=HT.esc,tabs=document.getElementById('lvTabs'),pan=document.getElementById('lvPanels');
tabs.innerHTML=HT.LV.map(l=>'<button type="button" data-t="'+l+'">'+l.toUpperCase()+'</button>').join('');
pan.innerHTML=HT.LV.map(l=>'<section class="ht-panel" id="'+l+'" hidden><nav class="ht-toc" id="toc-'+l+'"></nav><div id="b-'+l+'"><p class="mut">Đang tải…</p></div></section>').join('');
const done={};
async function fill(l){if(done[l])return;done[l]=1;const box=document.getElementById('b-'+l),toc=document.getElementById('toc-'+l);
 try{const rs=[];for(const [s,name] of SEC)rs.push(await LOCK.free('/free/list?level='+l+'&section='+s).then(j=>[s,name,j]));
  const ok=rs.filter(r=>r[2].total>0);
  toc.innerHTML=ok.map(([s,name,j])=>'<a href="#'+l+'-'+s+'" onclick="var d=document.getElementById(\''+l+'-'+s+'\');d.open=true;d.scrollIntoView();return false">'+name+' · '+j.freeCount+'/'+j.total+'</a>').join('');
  box.innerHTML=ok.map(([s,name,j],k)=>'<details class="ht-yr" id="'+l+'-'+s+'"'+(k===0?' open':'')+'><summary>'+name+' · mở '+j.freeCount+'/'+j.total+' bài</summary><div class="in">'+
   j.lessons.map(x=>x.free?'<a class="ht-row" href="lesson.html?id='+encodeURIComponent(x.id)+'&lv='+l+'&s='+s+'"><span>'+ruby(esc(x.title))+'</span><span class="tg">Học thử ▶</span></a>':'<a class="ht-row lock" href="dang-nhap.html"><span>🔒 '+ruby(esc(x.title))+'</span><span class="tg">Cần đăng ký</span></a>').join('')+'</div></details>').join('')||'<p class="mut">Chưa có bài.</p>';
 }catch(e){done[l]=0;box.innerHTML='<div class="ht-lockbig"><p>⚠️ '+e.message+'</p><button class="ht-big" onclick="location.reload()">Thử lại</button></div>'}}
HT.tabs(document.getElementById('root'),fill);
if(!(localStorage.getItem('hn_sess_v1')||localStorage.getItem('hn_admin_sess_v1'))){window.HN_GUEST=true;document.documentElement.classList.add('guest');HT.bar('Thích bài học thử?')}
})();
</script><script src="don-khach.js?v=ae379fec"></script></body></html>
