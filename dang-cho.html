<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23cf3a2e'/%3E%3Ctext x='32' y='45' font-family='serif' font-size='36' font-weight='700' fill='white' text-anchor='middle'%3E%E6%97%A5%3C/text%3E%3C/svg%3E"><script>(function(){var t='';try{t=localStorage.getItem('hn_theme')||''}catch(e){}if(t!=='dark'&&t!=='light'){try{t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){t='light'}}document.documentElement.dataset.theme=t})()</script><link rel="stylesheet" href="style.css?v=55bd96c3"><title>Đang chờ duyệt – Học tiếng Nhật</title><meta name="description" content="Tài khoản đang chờ Khánh duyệt. Được duyệt xong sẽ mở được toàn bộ bài học."><meta property="og:title" content="Đang chờ duyệt – Học tiếng Nhật"><meta property="og:description" content="Tài khoản đang chờ Khánh duyệt. Được duyệt xong sẽ mở được toàn bộ bài học."><meta property="og:type" content="website"><meta property="og:image" content="https://nhabaovieck7-cpu.github.io/hoc-tieng-nhat/icons/icon-512.png"></head><body>
<div class="topbar"><div class="wrap"><a class="brand site-title" href="index.html"></a><nav class="nav">
<a href="index.html">Trang chủ</a><a href="dang-nhap.html">Tài khoản</a></nav></div></div>
<main class="wrap">
<div class="authcard waitbox">
  <div class="big">⏳</div>
  <h1>Đang chờ duyệt</h1>
  <p class="sub" id="msg">Tài khoản của bạn đã gửi cho Khánh. Khi được <b>Duyệt</b>, bạn sẽ mở được bài học. Trang này tự kiểm tra mỗi 20 giây.</p>
  <p class="honest" id="info"></p>
  <button class="primary" id="refresh" type="button">Kiểm tra lại</button>
  <p class="switch"><a href="dang-nhap.html">Quay lại đăng nhập</a> · <a href="#" id="out">Đăng xuất</a></p>
</div>
</main>
<script src="config.js?v=c2a095db"></script><script src="common.js?v=abda9452"></script><script src="auth.js?v=e9bae38a"></script><script src="lock.js?v=6f8fc162"></script>
<script>
document.querySelectorAll('.site-title').forEach(e=>e.textContent=SITE.title);
const info=document.getElementById('info'),msg=document.getElementById('msg');
async function check(){
  if(!AUTH.session()){location.href='dang-nhap.html';return}
  try{
    const j=await AUTH.me();
    info.textContent=(j.user&&j.user.email)?('Email: '+j.user.email):'';
    if(j.user.status==='approved'){
      if(j.contentKey)await LOCK.importContentKey(j.contentKey);
      msg.innerHTML='Đã được duyệt! Đang mở trang học…';
      location.href='index.html';return;
    }
    if(j.user.status==='rejected'){msg.textContent='Đăng ký đã bị từ chối. Liên hệ Khánh nếu cần.';return}
    if(j.user.status==='locked'){msg.textContent='Tài khoản đã bị khoá.';return}
  }catch(e){info.textContent=e.message}
}
document.getElementById('refresh').onclick=check;
// Tự kiểm tra lại mỗi ~20 giây (khi tab đang hiện) và khi tab được mở lại.
let busy=false;async function poll(){if(busy||document.hidden)return;busy=true;try{await check()}finally{busy=false}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
document.getElementById('out').onclick=async e=>{e.preventDefault();await AUTH.logout();location.href='dang-nhap.html'};
check();setInterval(poll,20000);
</script>
</body></html>
