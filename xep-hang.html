.xh-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:16px 0}
.xh-card h2{margin:0 0 12px;font-size:1.25rem}
.xh-h3{margin:18px 0 10px;font-size:1.05rem}
.xh-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.xh-tile{background:var(--soft);border-radius:12px;padding:10px 8px;text-align:center}
.xh-tile b{display:block;font-size:1.25rem;color:var(--c2)}
.xh-tile span{font-size:.78rem;color:var(--m);line-height:1.3;display:block;margin-top:2px}
.xh-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.xh-badge{border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;opacity:.55;filter:grayscale(.7)}
.xh-badge.got{opacity:1;filter:none;border-color:var(--gold);background:var(--shu-soft)}
.xh-b-ic{font-size:1.9rem;line-height:1.1}
.xh-b-name{font-weight:700;margin-top:4px}
.xh-b-desc{font-size:.8rem;color:var(--m);line-height:1.35;min-height:2.1em}
.xh-b-prog{font-size:.8rem;font-weight:600;margin-top:4px;color:var(--c2)}
.xh-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.xh-tabs button{border:1px solid var(--line);background:var(--card);color:var(--t);border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;min-height:40px}
.xh-tabs button.on{background:var(--c2);color:#fff;border-color:var(--c2)}
.xh-podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin-bottom:14px}
.xh-pod{background:var(--soft);border-radius:14px;padding:12px 6px 10px;text-align:center}
.xh-pod.p1{background:var(--shu-soft);border:1px solid var(--gold);padding-top:18px}
.xh-pod-medal{font-size:1.6rem}
.xh-pod .st-av{width:44px;height:44px;font-size:1.15rem}
.xh-pod-name{font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xh-pod-val{color:var(--c);font-weight:700}
.xh-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px dashed var(--line)}
.xh-row.me,.xh-pin{background:var(--shu-soft);border-radius:10px}
.xh-rk{width:30px;text-align:center;font-weight:700;color:var(--m);flex:none}
.xh-nm{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xh-vl{font-weight:700;color:var(--c);white-space:nowrap}
.xh-pin{display:flex;align-items:center;gap:10px;padding:10px 6px;margin-top:12px;border:1px solid var(--gold)}
