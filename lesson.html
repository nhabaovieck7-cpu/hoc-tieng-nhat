<script src="config.js?v=c2a095db"></script><script src="common.js?v=aa87e44d"></script><script src="auth.js?v=1807850c"></script><script src="features.js?v=e6afe047"></script><script src="lock.js?v=6f8fc162"></script><script>LOCK.run(['lessons','course'].concat((()=>{const m=(new URLSearchParams(location.search).get('id')||'').match(/^khoa-(n[1-5])-(np|tv|kj)-/);return m?['course_'+m[1]+'_'+m[2]]:[]})()))</script><script type="text/plain" id="main">
const l=LESSONS.find(x=>x.id==new URLSearchParams(location.search).get('id'));const m=document.getElementById('m'),toc=document.getElementById('toc');
if(!l){m.innerHTML='<section>Không tìm thấy bài học. <a href="index.html">Về trang chủ</a></section>';toc.remove()}else{
document.title=plain(l.title)+' – '+SITE.title;document.getElementById('t').innerHTML=ruby(l.title);
document.getElementById('tags').innerHTML='<span class="tag lv">'+l.level+'</span><span class="tag">'+l.type+'</span>'+(l.sample?'<span class="tag mau">Bài mẫu</span>':'');
const S=[];const sec=(t,html,c)=>{const id='s'+(S.length+1);S.push([id,t]);return '<section id="'+id+'"'+(c?' class="'+c+'"':'')+'><h2>'+t+'</h2>'+html+'</section>'};
let h='';if(l.explain.length)h+=sec('Giải thích',l.explain.map(e=>'<p>'+ruby(e)+'</p>').join(''));
if(l.examples.length)h+=sec('Ví dụ',l.examples.map(e=>'<div class="ex"><div class="jp">'+ruby(e.jp)+'</div><div class="vi">'+e.vi+'</div></div>').join(''));
const MQ=(qs,t,num)=>sec(t,'<div class="mcq"><p class="mqh">Chạm vào một phương án cho mỗi câu, rồi bấm <b>Chấm điểm</b>.</p>'+qs.map((x,i)=>'<div class="mq" data-c="'+x.c+'"><div class="mqq">'+(num?'<b>Câu '+(i+1)+':</b> ':'')+ruby(x.q)+'</div><div class="mo">'+x.o.map((o,j)=>'<button type="button" class="opt" data-i="'+j+'"><span class="on">'+(j+1)+'</span><span class="ot">'+ruby(o)+'</span></button>').join('')+'</div><div class="mx" hidden><div class="mxr"></div>'+ruby(x.a||'')+'</div></div>').join('')+'<div class="mbar"><button type="button" class="grade">Chấm điểm</button><button type="button" class="redo" hidden>Làm lại</button><span class="score"></span></div></div>');
const MQT='🎯 Trắc nghiệm – chấm điểm';
(l.sections||[]).forEach((s,i)=>{if(i==0&&l.mcq&&l.mcqAt<0)h+=MQ(l.mcq,MQT);h+=sec(ruby(s.h),ruby(s.html),'sec');if(l.mcq&&i==l.mcqAt)h+=MQ(l.mcq,MQT)});
if(l.quiz&&l.quiz.length&&l.quiz.every(x=>x.o))h+=MQ(l.quiz,'Luyện tập',1);
else if(l.quiz&&l.quiz.length)h+=sec('Luyện tập',l.quiz.map((x,i)=>'<div class="qa"><p><b>Câu '+(i+1)+':</b> '+ruby(x.q)+'</p><button>Xem đáp án</button><div class="ans">'+ruby(x.a)+'</div></div>').join('<hr>'));
m.innerHTML=F.rateBar()+h;m.querySelectorAll('table').forEach(t=>{const hs=[...t.querySelectorAll('th')].map(x=>x.textContent.trim());if(hs.length){const k=hs[0]=='Kanji'?'kjt':(hs[1]=='Từ'&&hs[2]=='Cách đọc'?'vt':'gt');t.classList.add('mc',k);t.querySelectorAll('tr').forEach(r=>{if(r.querySelector('th'))r.classList.add('hr');else[...r.children].forEach((c,i)=>{if(hs[i])c.setAttribute('data-l',hs[i])})})}});
m.querySelectorAll('table').forEach(t=>{if(!t.parentElement.classList.contains('tbl')){const w=document.createElement('div');w.className='tbl';t.before(w);w.append(t)}});
if(S.length>1){toc.innerHTML='<b>Mục lục</b>'+S.map(([id,t])=>'<a href="#'+id+'">'+t.replace(/<rt>.*?<\/rt>/g,'').replace(/<[^>]+>/g,'')+'</a>').join('');if(S.length>8)toc.classList.add('long')}else{toc.remove();document.querySelector('.layout').style.display='block'}
m.querySelectorAll('.mcq').forEach(Q=>{const qs=[...Q.querySelectorAll('.mq')],sc=Q.querySelector('.score'),g=Q.querySelector('.grade'),rd=Q.querySelector('.redo');
Q.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||Q.classList.contains('done'))return;b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x==b))});
g.onclick=()=>{let ok=0;qs.forEach(q=>{const c=+q.dataset.c,os=[...q.querySelectorAll('.opt')],s=os.findIndex(x=>x.classList.contains('sel'));os[c].classList.add('right');if(s==c){ok++;q.classList.add('qok')}else{q.classList.add('qbad');if(s>=0)os[s].classList.add('wrong')}
const x=q.querySelector('.mx');x.hidden=false;x.querySelector('.mxr').innerHTML=s==c?'✅ Đúng':(s<0?'⚪ Chưa chọn':'❌ Sai')+' – đáp án đúng: <b>'+(c+1)+'</b>'});
Q.classList.add('done');sc.textContent='Đúng '+ok+'/'+qs.length+' câu';sc.dataset.ok=ok;g.hidden=true;rd.hidden=false;sc.scrollIntoView&&sc.scrollIntoView({block:'nearest'})};
rd.onclick=()=>{Q.classList.remove('done');qs.forEach(q=>{q.classList.remove('qok','qbad');q.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel','right','wrong'));q.querySelector('.mx').hidden=true});sc.textContent='';g.hidden=false;rd.hidden=true}});
m.querySelectorAll('.qa button').forEach(b=>b.onclick=()=>{const a=b.nextElementSibling;a.classList.toggle('show');b.textContent=a.classList.contains('show')?'Ẩn đáp án':'Xem đáp án'})
// ==== tính năng mới: tiến độ, đọc to, hỏi AI, bình luận ====
F.P.seen(l.id,plain(l.title));F.bindRate(m);
m.querySelectorAll('.mcq').forEach((Q,i)=>Q.querySelector('.grade').addEventListener('click',()=>{const sc=Q.querySelector('.score');F.P.score(l.id+(i?'#'+i:''),plain(l.title)+(i?' ('+(i+1)+')':''),+sc.dataset.ok,Q.querySelectorAll('.mq').length)}));
F.dialogs(m);F.addSpeakers(m);
if(F.AI.on()&&/Ngữ pháp|Tổng hợp/.test(l.type))m.querySelectorAll('section.sec').forEach(s=>{const h=s.querySelector('h2');if(!h||!/[〜ぁ-んァ-ン一-龯]/.test(h.textContent))return;const t=F.tts.text(h).replace(/^\d+\.\s*/,'');const a=document.createElement('a');a.className='askai';a.href='hoi-ai.html?mau='+encodeURIComponent(t)+'&bai='+encodeURIComponent(plain(l.title));a.textContent='🤖 Hỏi AI về mẫu này';h.after(a)});
F.comments(document.getElementById('cmt'),l.id);
}
</script></body></html>
