const l=LESSONS.find(x=>x.id==new URLSearchParams(location.search).get('id'));const m=document.getElementById('m'),toc=document.getElementById('toc');
if(!l){m.innerHTML='<section>Không tìm thấy bài học. <a href="index.html">Về trang chủ</a></section>';toc.remove()}else{
document.title=plain(l.title)+' – '+SITE.title;document.getElementById('t').innerHTML=ruby(l.title);
document.getElementById('tags').innerHTML='<span class="tag lv">'+l.level+'</span><span class="tag">'+l.type+'</span>'+(l.sample?'<span class="tag mau">Bài mẫu</span>':'');
const TH=/^Tổng hợp/.test(l.type); // Bài Tổng hợp: bỏ toàn bộ phần phát âm thanh theo yêu cầu user
const S=[];const sec=(t,html,c)=>{const id='s'+(S.length+1);S.push([id,t]);return '<section id="'+id+'"'+(c?' class="'+c+'"':'')+'><h2>'+t+'</h2>'+html+'</section>'};
let h='';if(l.explain.length)h+=sec('Giải thích',l.explain.map(e=>'<p>'+ruby(e)+'</p>').join(''));
if(l.examples.length)h+=sec('Ví dụ',l.examples.map(e=>'<div class="ex"><div class="jp">'+ruby(e.jp)+'</div><div class="vi">'+e.vi+'</div></div>').join(''));
const MQ=(qs,t,num)=>sec(t,'<div class="mcq"><p class="mqh">Chạm vào một phương án cho mỗi câu, rồi bấm <b>Chấm điểm</b>.</p>'+qs.map((x,i)=>'<div class="mq" data-c="'+x.c+'"><div class="mqq">'+(num?'<b>Câu '+(i+1)+':</b> ':'')+ruby(x.q)+'</div><div class="mo">'+x.o.map((o,j)=>'<button type="button" class="opt" data-i="'+j+'"><span class="on">'+(j+1)+'</span><span class="ot">'+ruby(o)+'</span></button>').join('')+'</div><div class="mx" hidden><div class="mxr"></div>'+ruby(x.a||'')+'</div></div>').join('')+'<div class="mbar"><button type="button" class="grade">Chấm điểm</button><button type="button" class="redo" hidden>Làm lại</button><span class="score"></span></div></div>');
const MQT='🎯 Trắc nghiệm – chấm điểm';
// ==== GENQ: sinh trắc nghiệm kiểu JLPT (20–30 câu, chấm điểm) từ dữ liệu bài — chạy lúc hiển thị ====
const GQ_TX=s=>String(s==null?'':s).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
const GQ_PL=s=>String(s==null?'':s).replace(/\{([^|}]+)\|[^}]+\}/g,'$1').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
const GQ_HS=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const GQ_RG=seed=>{let a=(seed>>>0)||1;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const GQ_SH=(a,R)=>{for(let i=a.length-1;i>0;i--){const j=(R()*(i+1))|0;const t=a[i];a[i]=a[j];a[j]=t}return a};
function GQ_MK(R,q,right,pool,a){if(right==null)return null;const rp=GQ_PL(right);if(!rp)return null;const seen=new Set([rp]),d=[];for(const x of pool||[]){if(x==null)continue;const p=GQ_PL(x);if(!p||seen.has(p)||p==='—')continue;seen.add(p);d.push(x)}if(d.length<3)return null;GQ_SH(d,R);const o=d.slice(0,3);o.push(right);GQ_SH(o,R);return{q,o,c:o.indexOf(right),a:a||''}}
function GQ_BAG(){const seen=new Set(),list=[];return{add(x){if(!x)return;const k=GQ_PL(x.q);if(!k||seen.has(k))return;seen.add(k);list.push(x)},list}}
function GQ_PICK(R,groups,target){const bag=GQ_BAG();const gs=groups.map(g=>GQ_SH(g.filter(Boolean),R));let more=true;while(bag.list.length<target&&more){more=false;for(const g of gs){if(g.length){bag.add(g.shift());more=true;if(bag.list.length>=target)break}}}return bag.list}
function GQ_TABLES(l){const out=[];(l.sections||[]).forEach(s=>{const html=s.html||'';const th=[...html.matchAll(/<th[^>]*>(.*?)<\/th>/gs)].map(x=>GQ_TX(x[1]));if(!th.length)return;const rows=[];for(const m of html.matchAll(/<tr>(.*?)<\/tr>/gs)){const cells=[...m[1].matchAll(/<td[^>]*>(.*?)<\/td>/gs)].map(x=>x[1]);if(cells.length)rows.push(cells)}out.push({th,rows})});return out}
function GQ_VOCAB(l,R){
  const T=GQ_TABLES(l).find(t=>t.th.some(h=>h==='Cách đọc'));if(!T)return[];
  const V=[];
  for(const c of T.rows){if(c.length<5)continue;const word=c[1].trim();if(!word)continue;
    const mcell=c[4];const ix=mcell.match(/<div class="ix"><div class="jp">(.*?)<\/div><div class="vi">(.*?)<\/div><\/div>/s);
    const mean=GQ_TX(ix?mcell.slice(0,ix.index):mcell),read=GQ_TX(c[2]),hv=GQ_TX(c[3]);
    if(!mean||!read)continue;
    V.push({w:word,wp:GQ_PL(word),r:read,hv,mean,ej:ix?ix[1]:'',ev:ix?GQ_TX(ix[2]):''})}
  if(V.length<4)return[];
  const means=V.map(x=>x.mean),reads=V.map(x=>x.r),words=V.map(x=>x.w),evs=V.map(x=>x.ev).filter(Boolean);
  const g1=[],g2=[],g3=[],g4=[],g5=[];
  for(const x of V){
    g1.push(GQ_MK(R,'「'+x.w+'」 có nghĩa là gì?',x.mean,means,x.wp+'（'+x.r+'）— '+x.mean+(x.hv&&x.hv!=='—'?' · Hán Việt: '+x.hv:'')));
    if(x.wp!==x.r&&/[一-龯々]/.test(x.wp))g2.push(GQ_MK(R,'Cách đọc của 「'+x.wp+'」 là gì?',x.r,reads,x.wp+' đọc là '+x.r+' — '+x.mean));
    g3.push(GQ_MK(R,'Từ nào có nghĩa “'+x.mean+'”?',x.w,words,x.w+'（'+x.r+'）— '+x.mean));
    if(x.ej){
      let ej=x.ej,ok=false;
      if(ej.includes(x.w)){ej=ej.replace(x.w,'＿＿＿');ok=true}
      else{const tk=(ej.match(/\{[^{}]+\}/g)||[]).find(t=>GQ_PL(t)===x.wp||GQ_PL(t).startsWith(x.wp));if(tk){ej=ej.replace(tk,'＿＿＿');ok=true}}
      if(ok)g4.push(GQ_MK(R,'Điền từ thích hợp vào chỗ trống: '+ej,x.w,words,x.ev));
      if(x.ev)g5.push(GQ_MK(R,'Câu 「'+GQ_PL(x.ej)+'」 có nghĩa là gì?',x.ev,evs,x.ej));
    }
  }
  return GQ_PICK(R,[g1,g3,g2,g4,g5],26);
}
// ==== GQK: câu hỏi kanji sát đề thi JLPT (文字・語彙) — sinh từ dữ liệu bài ====
// Dạng đề thật: đọc từ gạch chân trong câu (T1), chọn chữ Hán cho từ kana trong câu (T2),
// điền từ vào chỗ trống theo ngữ cảnh (T3), nghĩa của từ trong câu (T4), chọn câu dùng từ đúng (T5).
// Bài không có câu ví dụ: dùng dạng gần đề nhất từ từ ghép (F1 đọc từ, F2 chọn chữ viết, F3 nghĩa từ, F4 chọn từ theo nghĩa).
// KHÔNG còn câu hỏi âm Hán Việt / âm On / âm Kun / nghĩa từng chữ rời.
function GQK_TARGET(x){
  if(!x.ej)return null;
  const bm=x.ej.match(/<b>(.*?)<\/b>/s);if(!bm)return null;
  const tm=bm[1].match(/\{([^|}]+)\|([^}]+)\}/);
  let base,read;
  if(tm){base=tm[1];read=tm[2]}else{base=GQ_PL(bm[1]);read=''}
  if(!base)return null;
  let cp=null;for(const c of x.cps){if(c.w===base||c.w.indexOf(base)===0||base.indexOf(c.w)===0){cp=c;break}}
  if(cp&&cp.r)read=cp.r;
  const marked=x.ej.replace(bm[0],'\u0001'+bm[1]+'\u0002');
  const plain=GQ_PL(marked),si=plain.indexOf('\u0001'),ei=plain.indexOf('\u0002');
  if(si<0||ei<0)return null;
  const before=plain.slice(0,si),span=plain.slice(si+1,ei),after=plain.slice(ei+1);
  if(span!==base)return null;
  // bề mặt đầy đủ của từ trong câu: nếu từ ghép dài hơn phần in đậm (okurigana nằm ngoài token)
  let surf=base,okuri='';
  if(cp&&cp.w.indexOf(base)===0&&cp.w.length>base.length){const tail=cp.w.slice(base.length);if(after.indexOf(tail)===0){surf=cp.w;okuri=tail}}
  else if(!cp){const m=after.match(/^[ぁ-ん]+/);if(m){let ok='';for(const ch of m[0]){if('を,は,が,に,へ,と,も,の,で,や,か,だ'.indexOf(ch)>=0)break;ok+=ch;if(ok.length>=3)break}if(ok&&ok===m[0]&&!/^[ぁ-ん]/.test(after.slice(ok.length))){okuri=ok;surf=base+ok;if(read)read=read+ok}}}
  return{base,read,cp,surf,okuri,before,after,plain:before+base+after};
}
function GQK_VARIANTS(base,K,realSet){
  // biến thể sai kiểu đề thi: thay 1 chữ trong từ bằng chữ khác của cùng bài (ưu tiên chữ đồng âm)
  const chars=[...base],out=[],seen=new Set([base]);
  const byChar={};for(const e of K){const rs=new Set();String(e.on||'').split(/[、,]/).forEach(v=>{v=v.trim();if(v&&v!=='—')rs.add(v)});String(e.kun||'').split(/[・、,]/).forEach(v=>{v=v.trim();if(v&&v!=='—')rs.add(v)});byChar[e.kj]=rs}
  const pool=K.map(e=>e.kj).filter(c=>c&&c!==base);
  for(let i=0;i<chars.length;i++){
    const orig=chars[i];if(!/[一-龯々]/.test(orig))continue;
    const same=[],rest=[];
    for(const c of pool){if(c===orig)continue;let sh=false;const a=byChar[orig],b=byChar[c];if(a&&b)for(const v of a)if(b.has(v)){sh=true;break}(sh?same:rest).push(c)}
    for(const c of same.concat(rest)){
      const v=chars.slice();v[i]=c;const w=v.join('');
      if(seen.has(w)||realSet.has(w))continue;seen.add(w);out.push(w);if(out.length>=6)break;
    }
    if(out.length>=6)break;
  }
  return out;
}
function GQK_GROUPS(l,R){
  const K=(typeof GM_KDATA==='function')?GM_KDATA(l):[];
  const G={T1:[],T2:[],T3:[],T4:[],T5:[],F1:[],F2:[],F3:[],F4:[]};
  if(K.length<4)return G;
  const CP=[];K.forEach(x=>x.cps.forEach(cp=>CP.push(cp)));
  const realSet=new Set();CP.forEach(c=>realSet.add(c.w));K.forEach(x=>realSet.add(x.kj));
  const tg={};K.forEach(x=>{const t=GQK_TARGET(x);if(t){tg[x.kj]=t;realSet.add(t.base);realSet.add(t.surf)}});
  // khung câu trùng nhau (chỉ khác từ đích) -> điền trống sẽ có 2 đáp án đúng, phải loại
  const frameN={};Object.keys(tg).forEach(kj=>{const t=tg[kj];const fk=t.before+' '+t.after;frameN[fk]=(frameN[fk]||0)+1});
  const allReads=CP.map(c=>c.r),allMeans=CP.map(c=>c.m),allWords=CP.map(c=>c.w);
  // bản đồ mơ hồ: từ có nhiều cách đọc/nghĩa khác nhau trong cùng bài -> không ra câu hỏi rời cho từ đó
  const wR={},wM={},mW={},rmW={};
  CP.forEach(c=>{(wR[c.w]=wR[c.w]||new Set()).add(c.r);(wM[c.w]=wM[c.w]||new Set()).add(c.m);(mW[c.m]=mW[c.m]||new Set()).add(c.w);(rmW[c.r+'|'+c.m]=rmW[c.r+'|'+c.m]||new Set()).add(c.w)});
  Object.keys(tg).forEach(kj=>{const t=tg[kj];allReads.push(t.read);if(t.cp)allMeans.push(t.cp.m);allWords.push(t.surf)});
  const meanOf=t=>t.cp?t.cp.m:'';
  for(const x of K){
    const t=tg[x.kj];
    if(t){
      const exA=(t.cp?(t.surf+'（'+t.read+'）— '+t.cp.m):(t.surf+' đọc là '+t.read))+(x.ev?' · Dịch câu: '+x.ev:'');
      const sentU=t.before+'<u>'+t.base+'</u>'+t.after;
      G.T1.push(GQ_MK(R,sentU+' — Từ được gạch chân trong câu đọc là gì?',t.read,allReads,exA));
      const vars=GQK_VARIANTS(t.base,K,realSet);
      if(vars.length>=3)G.T2.push(GQ_MK(R,t.before+'<b>'+t.read+'</b>'+t.after.slice(t.okuri.length)+' — Từ in đậm trong câu viết bằng chữ Hán là gì?',t.base,vars,exA));
      if(frameN[t.before+' '+t.after]<=1)G.T3.push(GQ_MK(R,'Điền từ thích hợp vào chỗ trống: '+t.before+'＿＿＿'+t.after,t.surf,allWords,x.ev||exA));
      if(t.cp)G.T4.push(GQ_MK(R,sentU+' — Từ được gạch chân trong câu có nghĩa là gì?',t.cp.m,allMeans,exA));
      if(t.cp){
        const myTok=new Set(String(t.cp.m).toLowerCase().split(/[\s,;、]+/).filter(v=>v.length>=2));
        const dis=[];
        for(const y of K){if(y===x)continue;const ty=tg[y.kj];if(!ty||!ty.cp)continue;
          const oTok=String(ty.cp.m).toLowerCase().split(/[\s,;、]+/).filter(v=>v.length>=2);
          if(oTok.some(v=>myTok.has(v)))continue;
          if(ty.plain.indexOf(t.surf)>=0)continue;
          dis.push(ty.before+t.surf+ty.after);if(dis.length>=3)break}
        if(dis.length>=3)G.T5.push(GQ_MK(R,'Câu nào dùng từ 「'+t.surf+'」 đúng?',t.plain,dis,exA));
      }
    }
    // dạng dự phòng từ từ ghép (bài không có ví dụ, hoặc bổ sung cho đủ bộ)
    for(const cp of x.cps){
      if(wR[cp.w].size<=1)G.F1.push(GQ_MK(R,'Từ 「'+cp.w+'」 đọc là gì?',cp.r,allReads,cp.w+'（'+cp.r+'）— '+cp.m));
      if(/[一-龯々]/.test(cp.w)&&rmW[cp.r+'|'+cp.m].size<=1){const vars=GQK_VARIANTS(cp.w,K,realSet);if(vars.length>=3)G.F2.push(GQ_MK(R,'Từ đọc là 「'+cp.r+'」, có nghĩa “'+cp.m+'”, viết bằng chữ Hán là gì?',cp.w,vars,cp.w+'（'+cp.r+'）— '+cp.m))}
      if(wM[cp.w].size<=1)G.F3.push(GQ_MK(R,'Từ 「'+cp.w+'」 có nghĩa là gì?',cp.m,allMeans,cp.w+'（'+cp.r+'）— '+cp.m));
      if(mW[cp.m].size<=1)G.F4.push(GQ_MK(R,'Từ nào có nghĩa “'+cp.m+'”?',cp.w,allWords,cp.w+'（'+cp.r+'）— '+cp.m));

  +'.gm-tile{font:inherit;font-size:17px;min-height:48px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--ai,#233d63);background:var(--card);color:inherit;cursor:pointer}'

  +'.gm-clear{font:inherit;min-height:48px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:inherit;cursor:pointer}'
  +'.gm-end{text-align:center;padding:10px 0}'
  +'.gm-end .gm-big{font-size:24px;font-weight:700;margin:8px 0}'
  +'.gm-miss{text-align:left;margin:12px 0;line-height:1.7}'
  +'.gm-miss li{margin-bottom:8px}';
  document.head.appendChild(st);
  const card=document.createElement('section');card.className='gm-open';
  card.innerHTML='<h2>🎮 Đấu trùm ôn tập</h2><p>Ôn chính bài này bằng một ván đấu trùm: 10 câu trộn — chọn đáp án, xếp câu, nghe và chọn. Trả lời đúng để đánh trùm, câu sai sẽ quay lại ở vòng gọi hồn cuối ván.</p><button type="button" class="gm-start">Bắt đầu đấu trùm</button>';
  const anchor=m.querySelector('.mcq.genq');if(anchor)anchor.after(card);else m.appendChild(card);
  const ov=document.createElement('div');ov.className='gm';ov.hidden=true;
  ov.innerHTML='<div class="gm-card"><div class="gm-head"><span class="gm-title">🎮 Đấu trùm ôn tập</span><button type="button" class="gm-x" aria-label="Đóng">✕</button></div>'
  +'<div class="gm-bar"><span>👹 Trùm</span><div class="gm-track"><div class="gm-fill boss"></div></div><b class="gm-bossn">100</b></div>'
  +'<div class="gm-bar"><span>🧑 Bạn</span><div class="gm-track"><div class="gm-fill you"></div></div><b class="gm-youn">100</b></div>'
  +'<div class="gm-meta"><span class="gm-prog"></span><span class="gm-xp"></span><span class="gm-streak"></span></div>'
  +'<div class="gm-body"></div></div>';
  document.body.appendChild(ov);
  const G={att:0,boss:100,you:100,xp:0,streak:0,best:0,round:[],i:0,phase:'main',ghost:[],miss:[],okMain:0,nMain:0,okGhost:0,cur:null,tries:0};
  ov._gm=G;
  const el=s=>ov.querySelector(s);
  function bars(){el('.gm-fill.boss').style.width=Math.max(0,G.boss)+'%';el('.gm-bossn').textContent=Math.max(0,G.boss);el('.gm-fill.you').style.width=Math.max(0,G.you)+'%';el('.gm-youn').textContent=Math.max(0,G.you);
    el('.gm-prog').textContent=G.phase==='ghost'?('👻 Vòng gọi hồn · Câu '+(G.i+1)+'/'+G.round.length):('Câu '+(G.i+1)+'/'+G.round.length);
    el('.gm-xp').textContent='XP: '+G.xp;el('.gm-streak').textContent=G.streak>1?('🔥 Chuỗi đúng: '+G.streak):''}
  function speak(t){try{if(window.F&&F.tts&&t)F.tts.speak(t)}catch(e){}}
  function start(){G.att++;const R=GQ_RG(GQ_HS(l.id)+G.att*104729);let PP=null;try{PP=GM_POOLS(l,R)}catch(e){}
    if(!PP){close();return}
    G.boss=100;G.you=100;G.xp=0;G.streak=0;G.best=0;G.ghost=[];G.miss=[];G.okMain=0;G.nMain=0;G.okGhost=0;G.phase='main';
    G.round=GM_ROUND(PP.pools,R);G.i=0;ov.hidden=false;document.body.style.overflow='hidden';next()}
  function close(){ov.hidden=true;document.body.style.overflow='';try{if(window.F&&F.tts&&F.tts.stop)F.tts.stop()}catch(e){}}
  function next(){
    if(G.boss<=0)return end(true);
    if(G.you<=0)return end(false);
    if(G.i>=G.round.length){
      if(G.phase==='main'&&G.ghost.length){G.phase='ghost';G.round=G.ghost.map(q=>{if(q.k==='tile')return q;const o=GQ_SH(q.o.slice(),GQ_RG(GQ_HS(l.id)+G.att*31+G.miss.length*7+G.i));return Object.assign({},q,{o,c:o.indexOf(q.o[q.c])})});G.i=0;return next()}
      return end(G.boss<=0);
    }
    G.cur=G.round[G.i];G.tries=0;bars();renderQ();
  }
  function judge(ok,rightText){
    const q=G.cur;
    if(G.phase==='main'){
      G.nMain++;
      if(ok){G.okMain++;G.boss-=12;G.xp+=10;G.streak++;if(G.streak>G.best)G.best=G.streak}
      else{G.you-=10;G.streak=0;G.ghost.push(q);G.miss.push({q:q.k==='tile'?('Xếp câu: '+(q.vi||q.sent)):GQ_PL(q.q),right:rightText,a:q.a||''})}
    }else{
      if(ok){G.okGhost++;G.boss-=6;G.xp+=5;G.streak++;if(G.streak>G.best)G.best=G.streak}
      else G.streak=0;
    }
    bars();
  }
  function fb(ok,q,rightText){
    const f=el('.gm-fb');f.hidden=false;
    f.innerHTML=(ok?'<b>✅ Đúng!</b>':'<b>❌ Chưa đúng</b> — đáp án đúng: <b>'+rightText+'</b>')+(q.a?'<div>'+ruby(q.a)+'</div>':'')
      +(q.k==='tile'?'<div><button type="button" class="gm-listen">🔊 Nghe câu đúng</button></div>':'')
      +'<div><button type="button" class="gm-next">'+((G.boss<=0||G.you<=0||(G.i+1>=G.round.length&&!(G.phase==='main'&&G.ghost.length)))?'Xem kết quả':'Câu tiếp theo')+' →</button></div>';
    const lb=f.querySelector('.gm-listen');if(lb)lb.onclick=()=>speak(q.sent);
    f.querySelector('.gm-next').onclick=()=>{G.i++;next()};
  }
  function renderQ(){
    const q=G.cur,b=el('.gm-body');
    if(q.k==='tile'){renderTile(q,b);return}
    b.innerHTML='<div class="gm-q">'+ruby(q.q)+'</div>'
      +(q.speak?'<button type="button" class="gm-listen">🔊 Nghe lại</button>':'')
      +'<div class="gm-opts">'+q.o.map((o,j)=>'<button type="button" class="opt gm-opt" data-j="'+j+'"><span class="on">'+(j+1)+'</span><span class="ot">'+ruby(o)+'</span></button>').join('')+'</div>'
      +'<div class="gm-fb" hidden></div>';
    const lb=b.querySelector('.gm-listen');if(lb)lb.onclick=()=>speak(q.speak);
    if(q.speak)speak(q.speak);
    b.querySelectorAll('.gm-opt').forEach(btn=>btn.onclick=()=>{
      const j=+btn.dataset.j;b.querySelectorAll('.gm-opt').forEach(x=>x.disabled=true);
      b.querySelectorAll('.gm-opt')[q.c].classList.add('right');
      if(j!==q.c)btn.classList.add('wrong');
      judge(j===q.c,GQ_PL(q.o[q.c]));fb(j===q.c,q,GQ_PL(q.o[q.c]));
    });
  }
  function renderTile(q,b){
    const R=GQ_RG(GQ_HS(l.id)+G.att*57+G.i*13);
    const tray=GQ_SH(q.tiles.map((t,i)=>({t,ok:1,i})).concat((q.dis||[]).map(t=>({t,ok:0,i:-1}))),R);
    b.innerHTML='<div class="gm-q">Xếp các thẻ thành câu đúng'+(q.vi?' — nghĩa: “'+q.vi+'”':'')+'</div>'
      +'<div class="gm-ans"></div><div class="gm-tray">'+tray.map((x,k)=>'<button type="button" class="gm-tile'+(x.ok?'':' dis')+'" data-k="'+k+'">'+x.t+'</button>').join('')+'</div>'
      +'<div class="gm-row"><button type="button" class="gm-check">Kiểm tra</button><button type="button" class="gm-clear">Xếp lại từ đầu</button></div>'
      +'<div class="gm-fb" hidden></div>';
    const ans=b.querySelector('.gm-ans'),tryEl=b.querySelector('.gm-tray');
    const items=tray.slice();
    function pick(btn,fromAns){
      const k=+btn.dataset.k;
      if(fromAns){tryEl.appendChild(btn)}else{ans.appendChild(btn)}
    }
    tryEl.querySelectorAll('.gm-tile').forEach(btn=>btn.onclick=()=>{const inAns=btn.parentElement===ans;pick(btn,inAns)});
    b.querySelector('.gm-clear').onclick=()=>{[...ans.querySelectorAll('.gm-tile')].forEach(x=>tryEl.appendChild(x))};
    b.querySelector('.gm-check').onclick=()=>{
      const placed=[...ans.querySelectorAll('.gm-tile')];
      if(placed.length<q.tiles.length){const f=el('.gm-fb');f.hidden=false;f.innerHTML='Hãy xếp đủ '+q.tiles.length+' thẻ của câu (thẻ viền đỏ là thẻ gây nhiễu, không dùng).';return}
      const got=placed.map(x=>x.textContent).join('');
      if(got===q.sent){judge(true,q.sent);fb(true,q,q.sent)}
      else{
        G.tries++;
        if(G.tries<2){const f=el('.gm-fb');f.hidden=false;f.innerHTML='<b>Chưa đúng thứ tự</b> — hãy xếp lại (bấm vào thẻ đã xếp để trả về khay).';[...ans.querySelectorAll('.gm-tile')].forEach(x=>tryEl.appendChild(x))}
        else{placed.forEach(x=>x.disabled=true);b.querySelector('.gm-check').disabled=true;b.querySelector('.gm-clear').disabled=true;judge(false,q.sent);fb(false,q,q.sent)}
      }
    };
  }
  function end(win){
    G.phase='end';bars();
    const acc=G.nMain?Math.round(G.okMain/G.nMain*100):0;
    el('.gm-prog').textContent='Kết thúc ván';el('.gm-streak').textContent='';
    el('.gm-body').innerHTML='<div class="gm-end"><div class="gm-big">'+(win?'🏆 Thắng trùm!':'💥 Chưa hạ được trùm')+'</div>'
      +'<p>XP: <b>'+G.xp+'</b> · Độ chính xác: <b>'+acc+'%</b> ('+G.okMain+'/'+G.nMain+' câu chính)'+(G.okGhost?' · Gọi hồn cứu đúng: <b>'+G.okGhost+'</b> câu':'')+' · Chuỗi đúng dài nhất: <b>'+G.best+'</b></p>'
      +(G.miss.length?('<div class="gm-miss"><b>Các câu đã sai — đáp án đúng:</b><ul>'+G.miss.map(x=>'<li>'+x.q+'<br>→ <b>'+x.right+'</b>'+(x.a?' · '+GQ_PL(x.a):'')+'</li>').join('')+'</ul></div>'):'<p>Không sai câu nào. Tuyệt vời!</p>')
      +'<div class="gm-row" style="justify-content:center"><button type="button" class="gm-again">Đấu lại (bộ câu mới)</button><button type="button" class="gm-clear gm-done">Đóng</button></div></div>';
    el('.gm-body').querySelector('.gm-again').onclick=start;
    el('.gm-body').querySelector('.gm-done').onclick=close;
  }
  card.querySelector('.gm-start').onclick=start;
  ov.querySelector('.gm-x').onclick=close;
  ov.addEventListener('click',e=>{if(e.target===ov)close()});
})();

// ==== THẺ GHI NHỚ TRONG BÀI: bộ thẻ của chính bài này — dùng CHUNG kho SRS hn_srs_v1 và đúng thuật toán sinh thẻ với trang Ôn tập thẻ ====
(function(){try{
  if(TH)return;
  const mm=String(l.id||'').match(/^khoa-(n[1-5])-(tv|kj|np)-/);if(!mm)return;
  const LV=mm[1],PT=mm[2],DECK=LV+'_'+PT;
  if(!F.ls||!F.today)return;
  // --- sinh thẻ cho riêng bài này: sao đúng cards() của trang Ôn tập thẻ -> id thẻ trùng khớp tuyệt đối ---
  const tx=el=>{if(!el)return '';const c=el.cloneNode(true);c.querySelectorAll('rt,.ix,.spk').forEach(x=>x.remove());return c.textContent.trim()};
  const jpDom=s=>{const c=String(s||'').replace(/[（(][^）)]*[）)]/g,'');const jp=(c.match(/[ぁ-んァ-ン一-龯]/g)||[]).length;const lt=(c.match(/[A-Za-zÀ-ỹ]/g)||[]).length;return jp>0&&jp>=lt};
  const box=document.createElement('div');
  function fcGen(){const out=[];
   if(PT=='np'){(l.sections||[]).forEach(s=>{box.innerHTML=ruby(s.html);const p=[...box.querySelectorAll('p')].find(x=>/Nghĩa/.test(x.textContent));const ex=box.querySelector('.ex');const f=tx((()=>{const d=document.createElement('div');d.innerHTML=ruby(s.h);return d})()).replace(/^\d+\.\s*/,'');
    out.push({id:l.id+':'+f,f,rd:'',hv:'',m:p?p.textContent.replace(/^Nghĩa:\s*/,''):'',ej:ex?ex.querySelector('.jp').innerHTML:'',ev:ex&&ex.querySelector('.vi')?ex.querySelector('.vi').textContent:'',l:l.id})});return out}
   (l.sections||[]).forEach(s=>{box.innerHTML=ruby(s.html);const t=box.querySelector('table');if(!t)return;const hs=[...t.querySelectorAll('th')].map(x=>x.textContent.trim());
    [...t.querySelectorAll('tr')].slice(1).forEach(r=>{const td=[...r.children],g=h=>td[hs.indexOf(h)];const ix=r.querySelector('.ix');
     if(PT=='kj')out.push({id:l.id+':'+tx(g('Kanji')),f:tx(g('Kanji')),rd:[tx(g('Âm On')),tx(g('Âm Kun'))].filter(x=>x&&x!='—').join(' / '),hv:tx(g('Hán Việt')),m:tx(g('Nghĩa')),ej:ix?ix.querySelector('.jp').innerHTML:'',ev:ix?tx(ix.querySelector('.vi')):'',l:l.id});
     else out.push({id:l.id+':'+tx(g('Từ')),f:tx(g('Từ')),rd:tx(g('Cách đọc')),hv:tx(g('Hán Việt')),m:tx(g('Nghĩa')),ej:ix?ix.querySelector('.jp').innerHTML:'',ev:ix?tx(ix.querySelector('.vi')):'',l:l.id})})});return out}
  const seenId=new Set(),cardsAll=[];
  for(const c of fcGen()){if(!c.id||seenId.has(c.id))continue;seenId.add(c.id);cardsAll.push(c)}
  if(!cardsAll.length)return;
  // --- SRS dùng chung: cùng khoá hn_srs_v1, cùng hàm next() và cách đếm thẻ mới theo bộ/ngày như trang Ôn tập thẻ ---
  let S=F.ls.get('hn_srs_v1',{c:{},n:{}});if(!S.c)S.c={};if(!S.n)S.n={};
  const save=()=>F.ls.set('hn_srs_v1',S);
  const DAY=864e5,MIN=6e4;
  function fcNext(st,r){st=st||{iv:0,ef:2.5,reps:0};let iv=st.iv,ef=st.ef;
   if(r==0)return {iv:0,ef:Math.max(1.3,ef-.2),reps:0,due:Date.now()+MIN};
   if(r==1)iv=iv?Math.max(1,iv*1.2):1,ef=Math.max(1.3,ef-.15);else if(r==2)iv=iv?iv*ef:3;else iv=iv?iv*ef*1.3:7,ef+=.15;
   iv=Math.round(iv*10)/10;return {iv,ef,reps:st.reps+1,due:Date.now()+iv*DAY}}
  const fcLab=st=>[0,1,2,3].map(r=>{const n=fcNext(st,r);return r==0?'<1 phút':(n.iv<30?Math.round(n.iv)+' ngày':Math.round(n.iv/30)+' tháng')});
  function fcStats(){const now=Date.now();let due=0,fresh=0,learned=0;for(const c of cardsAll){const st=S.c[c.id];if(!st)fresh++;else{learned++;if(st.due<=now)due++}}return{due,fresh,learned,total:cardsAll.length}}
  function fcQueue(){const now=Date.now();const due=cardsAll.filter(c=>S.c[c.id]&&S.c[c.id].due<=now).sort((a,b)=>S.c[a.id].due-S.c[b.id].due);const fresh=cardsAll.filter(c=>!S.c[c.id]);const later=cardsAll.filter(c=>S.c[c.id]&&S.c[c.id].due>now);return due.concat(fresh,later)}
  // --- giao diện ---
  const stl=document.createElement('style');stl.textContent='.fc-open{margin:18px 0;padding:18px;border:1.5px solid var(--line);border-radius:var(--r,16px);background:var(--card)}'
  +'.fc-open h2{margin:0 0 6px}.fc-open p{margin:0 0 12px;color:var(--m)}'
  +'.fc-start{font:inherit;font-weight:600;min-height:48px;padding:10px 20px;border-radius:12px;border:0;background:var(--shu,#cf3a2e);color:#fff;cursor:pointer}'
  +'.fc-wrap{margin-top:14px}';
  document.head.appendChild(stl);
  const fcSec=document.createElement('section');fcSec.className='fc-open';
  fcSec.innerHTML='<h2>🃏 Ôn tập thẻ bài này</h2><p class="fc-desc"></p><button type="button" class="fc-start">Bắt đầu ôn thẻ</button><div class="fc-wrap" hidden><div class="mut fc-stat"></div><div class="bar" style="margin:6px 0 12px"><i class="fc-prog" style="width:0"></i></div><div class="fc-stage"></div><div class="mut" style="text-align:center">← Vuốt trái: Quên · Vuốt phải: Nhớ →</div></div>';
  const anchor=m.querySelector('.gm-open')||m.querySelector('.mcq.genq')||m.querySelector('.mcq');if(anchor)anchor.after(fcSec);else m.appendChild(fcSec);
  function fcHead(){const s=fcStats();fcSec.querySelector('.fc-desc').innerHTML='Bộ thẻ của riêng bài này: <b>'+s.total+'</b> thẻ'+(s.learned?' · đã học <b>'+s.learned+'</b>':'')+(s.due?' · <b>'+s.due+'</b> thẻ đến hạn ôn':'')+(s.fresh?' · <b>'+s.fresh+'</b> thẻ chưa học':'')+'. Chấm Quên/Nhớ ở đây tính chung vào trang Ôn tập thẻ.'}
  fcHead();
  let queue=[],cur=null,flipped=false,doneN=0,total0=0,active=false;
  const stage=()=>fcSec.querySelector('.fc-stage');
  function fcShow(){cur=queue[0];flipped=false;const el=stage();
   fcSec.querySelector('.fc-stat').innerHTML='Còn lại <b>'+queue.length+'</b> thẻ trong lượt ôn này';
   fcSec.querySelector('.fc-prog').style.width=(total0?Math.round(100*doneN/total0):100)+'%';
   if(!cur){el.innerHTML='<div class="fc"><div class="big">🎉</div><b>Đã ôn hết thẻ của bài này!</b><p class="mut">Tiến độ đã lưu chung với trang Ôn tập thẻ — thẻ đến hạn sẽ hiện ở đó đúng lịch.</p></div>';fcHead();return}
   el.innerHTML='<div class="fc fcard"><div class="side">Mặt trước</div><div class="big">'+F.esc(cur.f)+'</div><div class="fcsp"></div><div class="hint">Chạm để lật thẻ</div></div><div class="fcback"></div><div class="fcrt"></div>';
   const sp=el.querySelector('.fcsp');if(F.tts.ok&&jpDom(cur.f))sp.append(F.spkBtn(()=>cur.f));
   const cd=el.querySelector('.fcard');cd.onclick=fcFlip;fcSwipe(cd)}
  function fcFlip(){if(flipped||!cur)return;flipped=true;const st=S.c[cur.id],L=fcLab(st);const el=stage();
   el.querySelector('.fcback').innerHTML='<div class="fc back" style="margin-top:10px;cursor:default"><div class="side">Mặt sau</div>'+(cur.rd||cur.hv?'<div class="rd">'+F.esc(cur.rd)+(cur.hv?' · <span style="font-weight:400">'+F.esc(cur.hv)+'</span>':'')+'</div>':'')+'<div class="mean">'+F.esc(cur.m)+'</div>'+(cur.ej?'<div class="exj jp">'+cur.ej+'</div><div class="exv">'+F.esc(cur.ev)+'</div>':'')+'</div>';
   el.querySelector('.fcrt').innerHTML='<div class="rate">'+['Quên','Khó','Nhớ','Dễ'].map((t,i)=>'<button class="r'+i+'" data-r="'+i+'">'+t+'<small>'+L[i]+'</small></button>').join('')+'</div>';
   el.querySelectorAll('.rate button').forEach(b=>b.onclick=()=>fcRate(+b.dataset.r));if(cur.ej)F.addSpeakers(el.querySelector('.fcback'))}
  function fcRate(r){if(!cur)return;const isNew=!S.c[cur.id];S.c[cur.id]=fcNext(S.c[cur.id],r);if(isNew){const t=F.today();S.n={[t]:S.n[t]||{}};S.n[t][DECK]=(S.n[t][DECK]||0)+1}save();if(F.P&&F.P.touch)F.P.touch();
   queue.shift();if(r==0)queue.push(cur);else doneN++;fcShow()}
  function fcSwipe(el){let x0=null;el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});el.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)<60)return;if(!flipped){fcFlip();return}fcRate(dx<0?0:2)})}
  fcSec.querySelector('.fc-start').onclick=()=>{const w=fcSec.querySelector('.fc-wrap'),b=fcSec.querySelector('.fc-start');
   if(!w.hidden){w.hidden=true;active=false;b.textContent='Bắt đầu ôn thẻ';fcHead();return}
   S=F.ls.get('hn_srs_v1',{c:{},n:{}});if(!S.c)S.c={};if(!S.n)S.n={};queue=fcQueue();doneN=0;total0=queue.length;w.hidden=false;active=true;b.textContent='Thu gọn phần thẻ';fcShow()};
  document.addEventListener('keydown',e=>{if(!active||!cur||e.target.closest('input,textarea,select'))return;if(e.key==' '){e.preventDefault();fcFlip()}else if(flipped&&'1234'.includes(e.key))fcRate(+e.key-1)});
}catch(e){try{console.warn('FC lesson',e)}catch(_){}}})();

}
